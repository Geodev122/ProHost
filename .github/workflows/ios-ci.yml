name: iOS CI

# Builds the iOS app (Swift host + the shared Kotlin/Compose framework) and runs unit tests on a simulator. No Apple secrets needed (no signing).
on:
  push:
    paths: ["ios/**", "scripts/ios/**", "shared/**", "gradle/**", "*.gradle.kts", "gradle.properties", "app/src/main/res/values*/**", "app/src/main/java/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["ios/**", "scripts/ios/**", "shared/**", "gradle/**", "*.gradle.kts", "gradle.properties", "app/src/main/res/values*/**", "app/src/main/java/**", ".github/workflows/ios-ci.yml"]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Gradle builds the shared Kotlin framework from Xcode's pre-build script (ios/project.yml).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: String catalog is current and in parity (Android strings -> iOS)
        run: |
          python3 scripts/ios/test_strings.py
          python3 scripts/ios/strings_convert.py --out "$RUNNER_TEMP/Localizable.xcstrings"
          diff -q "$RUNNER_TEMP/Localizable.xcstrings" ios/ProHost/Resources/Localizable.xcstrings \
            || { echo "::error::Localizable.xcstrings is stale: run python3 scripts/ios/strings_convert.py and commit"; exit 1; }
          python3 scripts/ios/check_strings_parity.py

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: List analytics products of the resolved Firebase package (diagnostic)
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies -project ProHost.xcodeproj >/dev/null 2>&1 || true
          PKG=$(find ~/Library/Developer/Xcode/DerivedData -path '*SourcePackages/checkouts/firebase-ios-sdk/Package.swift' 2>/dev/null | head -1)
          echo "package: $PKG"
          grep -nE '\.library\(name: "(FirebaseAnalytics|FirebaseCrashlytics)[A-Za-z]*"|name: "FirebaseAnalytics[A-Za-z]*"' "$PKG" | head -12 || true

      - name: Build and test (simulator, unsigned)
        working-directory: ios
        run: |
          SIM=$(../scripts/ios/pick_simulator.sh)
          echo "Simulator: $SIM"
          xcodebuild test \
            -project ProHost.xcodeproj -scheme ProHost \
            -destination "id=$SIM" \
            -resultBundlePath build/test.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/test.xcresult
          retention-days: 7
