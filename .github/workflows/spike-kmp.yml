name: Spike KMP

# Throw-away spike for docs/migration/MASTER_PLAN.md P0 (spike/kmp). Manual only; touches no product build and deploys nothing.
# Versions can be overridden to find the working Kotlin / Compose Multiplatform / AGP combination.

on:
  workflow_dispatch: {}
  # A workflow that is not on the default branch cannot be dispatched, so the spike runs on pushes that touch spike/**.
  # Versions come from spike/kmp/versions.env (edit it and push to try another Kotlin / CMP / AGP combination).
  push:
    branches: ["claude/**"]
    paths:
      - "spike/**"
      - ".github/workflows/spike-kmp.yml"

permissions:
  contents: read

concurrency:
  group: spike-kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prep:
    name: Read versions
    runs-on: ubuntu-latest
    outputs:
      args: ${{ steps.v.outputs.args }}
      ios: ${{ steps.v.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          . spike/kmp/versions.env
          echo "args=-p spike/kmp -Pspike.kotlin=$KOTLIN -Pspike.cmp=$CMP -Pspike.agp=$AGP --no-daemon --stacktrace" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "::notice title=versions::Kotlin $KOTLIN, CMP $CMP, AGP $AGP, iOS job $IOS"

  linux:
    needs: prep
    env:
      GRADLE_ARGS: ${{ needs.prep.outputs.args }}
    name: Android + desktop tests + web (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: System libraries for the Skia runtime used by JVM host tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libfontconfig1 libxrender1 libxtst6 libxi6

      - name: Resources, plurals and format tests on the JVM host
        run: |
          set -o pipefail
          gradle $GRADLE_ARGS :shared:desktopTest 2>&1 | tee gradle-desktop.log

      - name: Android app builds from the shared module
        if: always()
        run: |
          set -o pipefail
          gradle $GRADLE_ARGS :androidApp:assembleDebug 2>&1 | tee gradle-android.log

      # Round 5: first real unit. Splash + font-scale cap rendered on Compose 1.12 / Kotlin 2.3 with the app's Robolectric settings.
      - name: Splash parity and font-scale cap tests (Robolectric)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          gradle $GRADLE_ARGS :androidApp:testDebugUnitTest --tests "spike.android.*" -i 2>&1 | tee gradle-parity.log

      - name: Diff the splash renders against the golden baseline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet pillow numpy
          python3 scripts/migration/fetch_ref.py golden-v1047 golden --only splash_
          ls spike/kmp/androidApp/build/spike-shots 2>/dev/null || echo "::error title=parity::no splash renders were written"
          mkdir -p parity
          python3 scripts/migration/diff_shots.py --golden golden --candidate spike/kmp/androidApp/build/spike-shots \
            --only splash_light,splash_dark --masks docs/migration/golden-masks.json --report parity/diff.html --json parity/diff.json | tee parity/summary.txt || true
          while IFS= read -r line; do echo "::notice title=splash-parity::${line}"; done < parity/summary.txt
          grep -h "FONT-SCALE-SEEN" gradle-parity.log | head -3 | while IFS= read -r line; do echo "::notice title=font-cap::${line}"; done || true

      - name: Compose for Web (wasmJs) builds from the same shared UI
        if: always()
        run: |
          set -o pipefail
          gradle $GRADLE_ARGS :webApp:wasmJsBrowserDistribution 2>&1 | tee gradle-web.log

      - name: Browser smoke test of the built web app (Chromium via Playwright)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --silent playwright && npx playwright install --with-deps chromium >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/pw/node_modules node scripts/migration/web_smoke.js spike/kmp/webApp/build/dist/wasmJs/productionExecutable \
            --expect-title "firebase:ok" --shot web-smoke.png 2>&1 | tee web-smoke.log
          while IFS= read -r line; do echo "::notice title=web-smoke::${line}"; done < web-smoke.log

      - name: Surface errors as annotations
        if: always()
        run: |
          for f in gradle-desktop.log gradle-android.log gradle-web.log; do
            [ -f $f ] || continue
            grep -iE "^e: |error:|FAILED|AssertionError|Unresolved|incompatible|requires" $f | head -25 | while IFS= read -r line; do echo "::error title=$f::${line}"; done
          done
          # first lines of each failing test's exception (Gradle prints them indented under the FAILED line)
          [ -f gradle-desktop.log ] && grep -A4 " FAILED$" gradle-desktop.log | head -40 | while IFS= read -r line; do echo "::warning title=desktop-test-detail::${line}"; done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-parity
          path: |
            parity
            web-smoke.png
            spike/kmp/androidApp/build/spike-shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-test-reports
          path: spike/kmp/shared/build/reports/tests
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-web-dist
          path: spike/kmp/webApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: ignore

  ios:
    name: iOS framework + simulator tests (macOS)
    needs: prep
    if: ${{ needs.prep.outputs.ios == 'true' }}
    env:
      GRADLE_ARGS: ${{ needs.prep.outputs.args }}
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Link the iOS framework
        run: |
          set -o pipefail
          gradle $GRADLE_ARGS :shared:linkDebugFrameworkIosSimulatorArm64 2>&1 | tee gradle-ios-link.log

      - name: Run the shared tests on the iOS simulator
        if: always()
        run: |
          set -o pipefail
          gradle $GRADLE_ARGS :shared:iosSimulatorArm64Test 2>&1 | tee gradle-ios-test.log

      - name: Surface errors as annotations
        if: always()
        run: |
          for f in gradle-ios-link.log gradle-ios-test.log; do
            [ -f $f ] || continue
            grep -iE "^e: |error:|FAILED|AssertionError|Unresolved|incompatible|requires" $f | head -25 | while IFS= read -r line; do echo "::error title=$f::${line}"; done
          done
