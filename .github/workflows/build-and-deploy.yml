name: ProHost CI/CD - Build & Deploy Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Generate Debug Keystore
        env:
          # Optional: a fixed debug keystore (base64) keeps testers' APK SHA-1/SHA-256 stable, so
          # it can be registered in Firebase (phone auth) and on the Maps key restriction.
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests & Build Debug APK
        env:
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
          # Without it the testers' APK ships an empty Maps key and every map renders blank.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:compileReleaseKotlin --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prohost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  functions-build:
    name: Compile Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install, Build & Unit-Test TypeScript Functions
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm test

  rules-tests:
    name: Security Rules Tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - name: Run Firestore + Storage rules tests
        working-directory: tests/rules
        run: |
          npm ci
          npm install -g firebase-tools
          npm test

  e2e-flows:
    name: End-to-end Backend Flows (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The real triggers and callables (functions/lib) in the Functions + Firestore + Auth
      # emulators: booking request → accept → occupancy, conflict guard, edits, Change price,
      # per-attendee re-pricing, withdraw/cancel pushes (tests/e2e/flows.test.js).
      - name: Run end-to-end flows
        run: |
          set -o pipefail
          npm ci --prefix functions
          npm install -g firebase-tools
          cd tests/e2e && npm test 2>&1 | tee "$RUNNER_TEMP/e2e.log" || {
            echo "::error title=e2e flows failed::$(grep -E 'not ok|Error|error|expected|actual|timed out|✖|⚠' "$RUNNER_TEMP/e2e.log" | grep -v 'EAFNOSUPPORT\|::1\|MOTD\|outdated version\|breaking changes' | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

  deploy-firebase:
    name: Deploy Live Firebase Backend
    if: github.event_name != 'pull_request'
    needs: [build-and-test, functions-build, rules-tests]
    runs-on: ubuntu-latest
    concurrency: firebase-deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Function Dependencies
        working-directory: functions
        run: npm ci

      - name: Write Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # On failure the tail of the output becomes an annotation, so the cause is readable from the
      # run summary / API without downloading logs.
      - name: Deploy Firebase Backend Resources
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy \
            --project prohost-f766f \
            --only functions,firestore,storage,hosting \
            --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log" || {
            echo "::error title=firebase deploy failed::$(grep -v '^\s*$' "$RUNNER_TEMP/deploy.log" | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
