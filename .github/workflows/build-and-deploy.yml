name: ProHost CI/CD - Build & Deploy Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: In-app legal text matches the website pages
        run: python3 scripts/legal/sync_legal_content.py --check

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Generate Debug Keystore
        env:
          # Optional: a fixed debug keystore (base64) keeps testers' APK SHA-1/SHA-256 stable, so
          # it can be registered in Firebase (phone auth) and on the Maps key restriction.
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests & Build Debug APK
        env:
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
          # Without it the testers' APK ships an empty Maps key and every map renders blank.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        # A crashed test JVM ("Test process encountered an unexpected problem", no failing test) is retried once; a failing test fails at once.
        run: |
          set +e
          for i in 1 2; do
            gradle :app:testDebugUnitTest :app:assembleDebug :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee gradle-unit.log
            code=${PIPESTATUS[0]}
            [ "$code" = 0 ] && break
            grep -q "Test process encountered an unexpected problem" gradle-unit.log || break
            echo "::warning title=unit-tests::test JVM crashed without a failing test (attempt $i); retrying once"
          done
          if [ "$code" != 0 ]; then
            grep -E "^e: |FAILED|unexpected problem" gradle-unit.log | head -30 | while IFS= read -r line; do echo "::error title=unit-tests::${line}"; done
          fi
          exit $code

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prohost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  functions-build:
    name: Compile Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install, Build & Unit-Test TypeScript Functions
        working-directory: functions
        run: |
          npm ci
          npm run build
          npm test

      # Kotlin and TypeScript share test vectors (tests/vectors): fail if the committed files no longer match the server code.
      - name: Shared test vectors are in sync
        run: node scripts/migration/export_vectors.js --check

      # docs/migration/PARITY.md must list every Kotlin source file (one row per migration unit).
      - name: Parity table lists every source file
        run: python3 scripts/migration/gen_parity_table.py --check

  rules-tests:
    name: Security Rules Tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json

      - name: Run Firestore + Storage rules tests
        working-directory: tests/rules
        run: |
          npm ci
          npm install -g firebase-tools
          npm test

  e2e-flows:
    name: End-to-end Backend Flows (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The real triggers and callables (functions/lib) in the Functions + Firestore + Auth
      # emulators: booking request → accept → occupancy, conflict guard, edits, Change price,
      # per-attendee re-pricing, withdraw/cancel pushes (tests/e2e/flows.test.js).
      - name: Run end-to-end flows
        run: |
          set -o pipefail
          npm ci --prefix functions
          npm install -g firebase-tools
          cd tests/e2e && npm test 2>&1 | tee "$RUNNER_TEMP/e2e.log" || {
            echo "::error title=e2e flows failed::$(grep -E 'not ok|Error|error|expected|actual|timed out|✖|⚠' "$RUNNER_TEMP/e2e.log" | grep -v 'EAFNOSUPPORT\|::1\|MOTD\|outdated version\|breaking changes' | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

  deploy-firebase:
    name: Deploy Live Firebase Backend
    if: github.event_name != 'pull_request'
    needs: [build-and-test, functions-build, rules-tests, e2e-flows]
    runs-on: ubuntu-latest
    concurrency: firebase-deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Function Dependencies
        working-directory: functions
        run: npm ci

      - name: Write Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # On failure the tail of the output becomes an annotation, so the cause is readable from the
      # run summary / API without downloading logs.
      - name: Deploy Firebase Backend Resources
        run: |
          set -o pipefail
          npx --yes firebase-tools@14 deploy \
            --project prohost-f766f \
            --only functions,firestore,storage,hosting \
            --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/deploy.log" || {
            echo "::error title=firebase deploy failed::$(grep -v '^\s*$' "$RUNNER_TEMP/deploy.log" | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      # Cloud Functions allows only so many updates per minute per region: with ~90 functions some updates fail with
      # "Quota exceeded" and keep running OLD code while the deploy still exits 0 (22 Nov 2026: 14 functions, incl.
      # onMaintenanceRequest). Redeploy exactly the functions that didn't report success, in small batches with pauses.
      - name: Redeploy functions that did not update (quota)
        run: |
          set -o pipefail
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log" > "$RUNNER_TEMP/deploy.clean.log"
          started=$(grep -oE '(updating|creating) Node\.js [0-9]+ \(2nd Gen\) function [A-Za-z0-9_]+\(' "$RUNNER_TEMP/deploy.clean.log" | sed -E 's/.* function ([A-Za-z0-9_]+)\(/\1/' | sort -u || true)
          ok=$(grep -oE 'functions\[[A-Za-z0-9_]+\(' "$RUNNER_TEMP/deploy.clean.log" | sed -E 's/functions\[([A-Za-z0-9_]+)\(/\1/' | sort -u || true)
          missing=$(comm -23 <(echo "$started") <(echo "$ok") | grep -v '^$' || true)
          # No function changed (e.g. a docs or hosting-only push): grep finds nothing, which is fine.
          if [ -z "$missing" ]; then echo "every function updated"; exit 0; fi
          echo "::warning title=functions to redeploy::$(echo $missing | tr ' ' ',')"
          for attempt in 1 2 3; do
            [ -z "$missing" ] && break
            sleep 75
            still=""
            for batch in $(echo "$missing" | xargs -n 6 | tr ' ' ',' ); do
              only=$(echo "$batch" | tr ',' '\n' | sed 's/^/functions:/' | paste -sd, -)
              if npx --yes firebase-tools@14 deploy --project prohost-f766f --only "$only" --non-interactive --force 2>&1 | tee -a "$RUNNER_TEMP/redeploy.log"; then :; else still="$still $(echo "$batch" | tr ',' ' ')"; fi
              sleep 30
            done
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/redeploy.log" > "$RUNNER_TEMP/redeploy.clean.log"
            done_now=$(grep -oE 'functions\[[A-Za-z0-9_]+\(' "$RUNNER_TEMP/redeploy.clean.log" | sed -E 's/functions\[([A-Za-z0-9_]+)\(/\1/' | sort -u || true)
            missing=$(comm -23 <(echo "$missing" | tr ' ' '\n' | sort -u) <(echo "$done_now") | grep -v '^$' || true)
          done
          if [ -n "$missing" ]; then
            echo "::error title=functions still on old code::$(echo $missing | tr ' ' ',')"
            exit 1
          fi
          echo "all redeployed"
