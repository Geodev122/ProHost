name: Inspect Material (temporary diagnostics)

# Prints which Compose / Material 3 versions the app resolves to and the library sources for the parts whose layout changed
# (migration P3.4 drift analysis). Read-only; delete when the drift is fixed.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspect-material.yml"]
  workflow_dispatch:
    inputs:
      pattern:
        description: "grep -E pattern for the source files"
        required: false
        default: "OutlinedTextFieldTopPadding|topPadding|TopPadding"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.7.1 }
      - name: Fetch Material 3 sources (1.3.1 old, 1.4.0 new)
        run: |
          for ver in 1.3.1 1.4.0; do
            mkdir -p "m3-$ver" && cd "m3-$ver"
            for art in material3-android material3; do
              curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/material3/$art/$ver/$art-$ver-sources.jar" && break
            done
            unzip -q -o s.jar || true
            cd ..
          done
      - name: minimizedLabelHalfHeight and OutlinedButton defaults (1.3.1 vs 1.4.0)
        run: |
          for ver in 1.3.1 1.4.0; do
            echo "##### $ver minimizedLabelHalfHeight"
            grep -rn "fun minimizedLabelHalfHeight" -B2 -A14 m3-$ver/commonMain | head -40
            echo "##### $ver outlinedButtonColors / border"
            grep -n "fun outlinedButtonColors\|fun outlinedButtonBorder\|outlinedButtonBorder\|OutlinedButtonTokens\|OutlinedButton.*Color\|contentColor = " m3-$ver/commonMain/androidx/compose/material3/Button.kt | head -40
            ls m3-$ver/commonMain/androidx/compose/material3/ | grep -i "ButtonDefaults\|tokens" | head
          done
      - name: ModalBottomSheet scrim and handle (1.3.1 vs 1.4.0)
        run: |
          for ver in 1.3.1 1.4.0; do
            echo "##### $ver ModalBottomSheet"
            f=$(find m3-$ver -name "ModalBottomSheet*.kt" | head -3)
            echo "$f"
            for x in $f; do grep -n "scrim\|Scrim\|alpha\|dragHandle\|DragHandle\|windowInsets\|statusBar\|navigationBar" $x | head -40; done
          done
      - name: Compose UI dialog dim (1.7.8 vs 1.12.1)
        run: |
          for ver in 1.7.8 1.12.1; do
            mkdir -p ui-$ver && cd ui-$ver
            curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/ui/ui-android/$ver/ui-android-$ver-sources.jar" || curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/ui/ui/$ver/ui-$ver-sources.jar"
            unzip -q -o s.jar || true
            echo "##### ui $ver dialog dim"
            grep -rn "DIM_BEHIND\|dimAmount\|backgroundDim\|scrim" --include=*.kt . | head -20
            cd ..
          done
