name: Inspect Material (temporary diagnostics)

# Prints Material 3 1.3.1 (the app's old version) vs 1.4.0 (current) source for the components whose defaults changed. Delete when done.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspect-material.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        run: |
          for ver in 1.3.1 1.4.0; do
            mkdir -p "m3-$ver" && cd "m3-$ver"
            for art in material3-android material3; do
              curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/material3/$art/$ver/$art-$ver-sources.jar" && break
            done
            unzip -q -o s.jar || true
            cd ..
          done
      - name: Chip tokens and border defaults
        run: |
          for ver in 1.3.1 1.4.0; do
            echo "##### $ver FilterChipTokens"; cat $(find m3-$ver -name "FilterChipTokens.kt" | head -1) | grep -E "Outline|SelectedContainer|Unselected|Disabled|LabelText|ContainerHeight|Elevation" | head -40
            echo "##### $ver filterChipBorder"; grep -n "fun filterChipBorder" -A32 m3-$ver/commonMain/androidx/compose/material3/Chip.kt | head -60
          done
      - name: Disabled filled button
        run: |
          for ver in 1.3.1 1.4.0; do
            echo "##### $ver FilledButtonTokens disabled"; cat $(find m3-$ver -name "FilledButtonTokens.kt" | head -1) | grep -E "Disabled" | head
          done
      - name: Surface tint / tonal elevation
        run: |
          for ver in 1.3.1 1.4.0; do
            echo "##### $ver surfaceColorAtElevation"; grep -rn "fun surfaceColorAtElevation" -A22 m3-$ver/commonMain/androidx/compose/material3/ColorScheme.kt | head -40
          done
