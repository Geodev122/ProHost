name: Inspect Material (temporary diagnostics)

# Prints which Compose / Material 3 versions the app resolves to and the library sources for the parts whose layout changed
# (migration P3.4 drift analysis). Read-only; delete when the drift is fixed.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspect-material.yml"]
  workflow_dispatch:
    inputs:
      pattern:
        description: "grep -E pattern for the source files"
        required: false
        default: "OutlinedTextFieldTopPadding|topPadding|TopPadding"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.7.1 }
      - name: Fetch Material 3 sources (1.3.1 old, 1.4.0 new)
        run: |
          for ver in 1.3.1 1.4.0; do
            mkdir -p "m3-$ver" && cd "m3-$ver"
            for art in material3-android material3; do
              curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/material3/$art/$ver/$art-$ver-sources.jar" && break
            done
            unzip -q -o s.jar || true
            cd ..
          done
      - name: Compose UI dialog theme resources (AAR) 1.7.8 vs 1.12.1
        run: |
          for ver in 1.7.8 1.12.1; do
            mkdir -p aar-$ver && cd aar-$ver
            curl -fsS -o ui.aar "https://dl.google.com/android/maven2/androidx/compose/ui/ui-android/$ver/ui-android-$ver.aar" || { echo "no aar for $ver"; cd ..; continue; }
            unzip -q -o ui.aar
            echo "##### $ver res files"; find res -type f | head -20
            echo "##### $ver DialogWindowTheme"; grep -rn "DialogWindowTheme" -A8 res/values/*.xml | head -30
            echo "##### $ver dim"; grep -rn "ackgroundDim\|dimAmount\|Dialog" res/values/*.xml | head -20
            cd ..
          done
      - name: Dialog sources
        run: |
          for ver in 1.7.8 1.12.1; do
            mkdir -p ui-$ver && cd ui-$ver
            curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/ui/ui-android/$ver/ui-android-$ver-sources.jar" || true
            unzip -q -o s.jar || true
            f=$(find . -name "AndroidDialog.android.kt" | head -1)
            echo "##### ui $ver $f"
            grep -n "Theme\|FLAG_\|setBackground\|windowBackground\|attributes\|dim\|R\.style" $f | head -40
            cd ..
          done
