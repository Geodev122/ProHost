name: Inspect Material (temporary diagnostics)

# Prints which Compose / Material 3 versions the app resolves to and the library sources for the parts whose layout changed
# (migration P3.4 drift analysis). Read-only; delete when the drift is fixed.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspect-material.yml"]
  workflow_dispatch:
    inputs:
      pattern:
        description: "grep -E pattern for the source files"
        required: false
        default: "OutlinedTextFieldTopPadding|topPadding|TopPadding"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.7.1 }
      - name: Resolved versions
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon -q 2>&1 | grep -E "material3|compose.foundation:foundation|compose.ui:ui:|compose.runtime:runtime:|compose.material:material" | sort -u | head -30
      - name: Sources of the resolved Material 3 and of 1.3.1
        run: |
          v=$(gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon -q 2>&1 | grep -oE "androidx.compose.material3:material3(-android)?:[0-9.a-z-]+" | grep -oE "[0-9][0-9.a-z-]*$" | sort -V | tail -1)
          echo "resolved material3 = $v"
          for ver in "$v" 1.3.1; do
            mkdir -p "m3-$ver" && cd "m3-$ver"
            for art in material3-android material3; do
              curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/material3/$art/$ver/$art-$ver-sources.jar" && break
            done
            unzip -q -o s.jar || true
            echo "=== $ver: files"; ls -R . | grep -E "OutlinedTextField|TextFieldImpl|ModalBottomSheet|Button.kt|AlertDialog" | head
            echo "=== $ver: hits for ${{ inputs.pattern || 'OutlinedTextFieldTopPadding|topPadding|TopPadding' }}"
            grep -rnE "${{ inputs.pattern || 'OutlinedTextFieldTopPadding|topPadding|TopPadding' }}" --include=*.kt . | head -40
            cd ..
          done
