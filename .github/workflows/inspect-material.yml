name: Inspect Material (temporary diagnostics)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspect-material.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        run: |
          for ver in 1.3.1 1.4.0; do
            mkdir -p "m3-$ver" && cd "m3-$ver"
            for art in material3-android material3; do
              curl -fsS -o s.jar "https://dl.google.com/android/maven2/androidx/compose/material3/$art/$ver/$art-$ver-sources.jar" && break
            done
            unzip -q -o s.jar || true
            cd ..
          done
      - name: Chip layout (SelectableChip) 1.3.1 vs 1.4.0
        run: |
          for ver in 1.3.1 1.4.0; do
            echo "##### $ver SelectableChip"; f=m3-$ver/commonMain/androidx/compose/material3/Chip.kt
            n=$(grep -n "private fun SelectableChip(" $f | head -1 | cut -d: -f1); sed -n "${n},$((n+70))p" $f
            echo "##### $ver chip consts"; grep -n "HorizontalElementsPadding\|ChipTokens.ContainerHeight\|LabelPadding\|minHeight\|Modifier.defaultMinSize\|heightIn" $f | head -20
          done
      - name: LinearProgressIndicator (Float overload) 1.3.1 vs 1.4.0
        run: |
          for ver in 1.3.1 1.4.0; do
            echo "##### $ver LinearProgressIndicator(progress: Float"; f=m3-$ver/commonMain/androidx/compose/material3/ProgressIndicator.kt
            grep -n "fun LinearProgressIndicator(" -A22 $f | head -130
          done
