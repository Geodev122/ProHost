name: Marketing voiceovers (manual)

# Generates the Lebanese Arabic voiceovers for marketing/*.mp4 with Google Cloud Text-to-Speech
# (CI service account) and commits them to marketing/voice/ on the branch it runs on.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: "Comma-separated post ids (blank = all six)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: marketing-voiceover

jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install google-auth requests imageio-ffmpeg

      - name: Write Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Synthesize
        env:
          POSTS: ${{ inputs.posts }}
        run: |
          set -o pipefail
          python scripts/marketing/voiceover.py "$RUNNER_TEMP/vo" "$POSTS" 2>&1 | tee "$RUNNER_TEMP/vo.log" || {
            echo "::error::$(tail -c 1500 "$RUNNER_TEMP/vo.log" | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice::$l"; done < <(grep -E '^post' "$RUNNER_TEMP/vo.log")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/voice
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Marketing: voiceovers (Cloud Text-to-Speech)"
          git push
