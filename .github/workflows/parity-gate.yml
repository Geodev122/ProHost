name: Parity Gate

# Owner rule for the KMP + Compose Multiplatform migration (docs/migration/MASTER_PLAN.md): NO visible change. On every push that touches
# app code or build files this job (1) compiles the app and runs its unit tests, (2) renders the 280 design screenshots exactly like the
# Design Screenshots workflow and (3) diffs them pixel by pixel against the golden baseline refs/design-shots/golden-v1047 (the untouched v1.0.47 app)
# (known dynamic regions masked by docs/migration/golden-masks.json). Any difference fails the job and the HTML report shows where.
# Never deploys. The only write is the Before/After sheets, pushed as a commit under refs/design-shots/parity-<branch> (not a branch),
# like the Design Screenshots workflow; the full renders are uploaded as an artifact.

on:
  workflow_dispatch:
    inputs:
      show:
        description: "Comma-separated render-name prefixes to include in the Before/After sheets even when identical (e.g. splash_,explore_)"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - "app/**"
      - "shared/**"
      - "androidApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "docs/migration/golden-masks.json"
      - "docs/migration/overlay-dim.json"
      - "docs/migration/scroll-offset.json"
      - "scripts/migration/diff_shots.py"
      - "scripts/migration/shots.py"
      - "scripts/migration/before_after.py"
      - ".github/workflows/parity-gate.yml"

permissions:
  contents: write

concurrency:
  group: parity-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, R8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          # Feature branches saved no Gradle cache (read-only by default), so every job downloaded the Kotlin compiler again and tripped over
          # Maven Central/GitHub 504s. Let these jobs save it.
          cache-read-only: false
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Compile (debug + release) and run the unit tests
        run: |
          set +e
          for i in 1 2 3; do
            gradle :app:testDebugUnitTest :app:assembleDebug :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee gradle-unit.log
            code=${PIPESTATUS[0]}
            [ "$code" = 0 ] && break
            echo "attempt $i failed (exit $code); retrying in 20 s in case of a transient dependency download error"
            sleep 20
          done
          exit $code
      # Release shrinking: proves proguard/dependency changes still produce a valid R8 build (the release-bundle workflow needs secrets).
      - name: R8 release shrink compiles
        run: |
          set +e
          for i in 1 2 3; do
            gradle :app:minifyReleaseWithR8 --no-daemon --stacktrace 2>&1 | tee gradle-r8.log
            code=${PIPESTATUS[0]}
            [ "$code" = 0 ] && break
            echo "attempt $i failed (exit $code); retrying in 20 s in case of a transient dependency download error"
            sleep 20
          done
          exit $code
      - name: Surface build errors
        if: failure()
        run: |
          for f in gradle-unit.log gradle-r8.log; do
            [ -f $f ] || continue
            grep -iE "^e: |FAILED|error:" $f | head -30 | while IFS= read -r line; do echo "::error title=$f::${line}"; done
          done

  render:
    name: Render shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          # Feature branches saved no Gradle cache (read-only by default), so every job downloaded the Kotlin compiler again and tripped over
          # Maven Central/GitHub 504s. Let these jobs save it.
          cache-read-only: false
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Render this shard of the 280 design screenshots
        run: |
          set +e
          for i in 1 2 3; do
            gradle :app:testDebugUnitTest -Proborazzi.test.record=true --tests "com.example.design.*" -PdesignOnly="" -PdesignShard=${{ matrix.shard }}/6 -PdesignTimeoutMin=12 --no-daemon --stacktrace 2>&1 | tee gradle-shots.log
            code=${PIPESTATUS[0]}
            [ "$code" = 0 ] && break
            echo "attempt $i failed (exit $code); retrying in 20 s in case of a transient dependency download error"
            sleep 20
          done
          exit $code
      - name: Surface build errors
        if: failure()
        run: |
          grep -iE "^e: |FAILED|error:" gradle-shots.log | head -30 | while IFS= read -r line; do echo "::error title=shard-${{ matrix.shard }}::${line}"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.shard }}
          path: app/build/design-shots
          retention-days: 3
          if-no-files-found: ignore

  diff:
    name: Diff against golden-v1047
    needs: [render]
    if: always() && needs.render.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          # Feature branches saved no Gradle cache (read-only by default), so every job downloaded the Kotlin compiler again and tripped over
          # Maven Central/GitHub 504s. Let these jobs save it.
          cache-read-only: false
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: app/build/design-shots
          merge-multiple: true

      - name: Diff against the golden baseline
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet pillow numpy
          python3 scripts/migration/fetch_ref.py golden-v1047 golden
          ls app/build/design-shots | wc -l
          mkdir -p parity
          set +e
          python3 scripts/migration/diff_shots.py --golden golden --candidate app/build/design-shots \
            --masks docs/migration/golden-masks.json --level-tol docs/migration/overlay-dim.json --shift-tol docs/migration/scroll-offset.json --report parity/diff.html --json parity/diff.json | tee parity/summary.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          tail -1 parity/summary.txt | while IFS= read -r line; do echo "::notice title=parity-first-pass::${line}"; done
          grep -E "^(CHANGED|RESIZED|MISSING)" parity/summary.txt | head -30 | while IFS= read -r line; do echo "::warning title=parity-first-pass::${line}"; done || true
          # Judged after the reproduce step below.

      # A real regression is deterministic; the harness still has a few timing-dependent inputs (network listing photos). So whatever
      # differed is rendered again, alone, up to 3 times, and the gate passes only when a re-render matches the golden EXACTLY: a real
      # regression can never match, a timing flake eventually does. No tolerance or mask is involved.
      - name: Reproduce the differences (re-render only those screens, up to 3 times)
        if: steps.diff.outputs.status != '0'
        id: repro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failing() { python3 -c "import json,sys; print(','.join(r['name'] for r in json.load(open(sys.argv[1]))['results'] if r['status'] != 'same'))" "$1"; }
          screens_of() { python3 -c "import sys; print(','.join(sorted({n[:-4].rsplit('_',1)[0] for n in sys.argv[1].split(',') if n})))" "$1"; }
          names=$(failing parity/diff.json)
          status=1
          for attempt in 1 2 3; do
            screens=$(screens_of "$names")
            echo "attempt ${attempt}: re-rendering ${screens} (${names})"
            set +e
            set -o pipefail
            gradle :app:testDebugUnitTest -Proborazzi.test.record=true --tests "com.example.design.*" -PdesignOnly="${screens}" --no-daemon --stacktrace 2>&1 | tee "gradle-rerun-${attempt}.log"
            set +o pipefail
            python3 scripts/migration/diff_shots.py --golden golden --candidate app/build/design-shots --only "$names" \
              --masks docs/migration/golden-masks.json --level-tol docs/migration/overlay-dim.json --shift-tol docs/migration/scroll-offset.json --report parity/diff-rerun.html --json parity/diff-rerun.json | tee parity/summary-rerun.txt
            status=${PIPESTATUS[0]}
            set -e
            tail -1 parity/summary-rerun.txt | while IFS= read -r line; do echo "::notice title=parity-reproduce-${attempt}::${line}"; done
            [ "$status" = 0 ] && break
            names=$(failing parity/diff-rerun.json)
          done
          if [ "$status" = 0 ]; then
            echo "::notice title=parity::first-pass differences did not reproduce (timing race, matched on re-render ${attempt}); final result: identical"
          else
            grep -E "^(CHANGED|RESIZED|MISSING)" parity/summary-rerun.txt | head -30 | while IFS= read -r line; do echo "::error title=parity-diff::${line}"; done || true
          fi
          exit $status

      # Before | After | Difference sheets for every changed render (+ any prefixes asked for with the `show` input, identical or not),
      # stored under refs/design-shots/parity-<branch> so they can be opened through the GitHub API.
      - name: Before/After sheets
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOW: ${{ inputs.show }}
        run: |
          [ -d golden ] && [ -d app/build/design-shots ] || exit 0
          pip install --quiet pillow numpy
          python3 scripts/migration/before_after.py --golden golden --candidate app/build/design-shots --out parity/before_after \
            --from-json parity/diff.json --show "${SHOW}" --masks docs/migration/golden-masks.json
          cd parity/before_after
          git init -q
          git add -A
          git -c user.name="parity-gate" -c user.email="parity-gate@users.noreply.github.com" commit -q -m "Before/after for ${GITHUB_SHA}"
          ref="refs/design-shots/parity-${GITHUB_REF_NAME//\//-}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${ref}"
          echo "::notice title=before-after::$(git rev-parse HEAD) ${ref}"

      - name: Upload report and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-gate
          path: |
            parity
            app/build/design-shots
          retention-days: 14
          if-no-files-found: ignore
