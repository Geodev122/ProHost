name: Harness diagnostics (temporary)

# Which design screens hang under the manual-clock harness? One job per screen, 6-minute cap, prints the outcome. Delete when fixed.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/harness-diag.yml"]

jobs:
  one:
    name: ${{ matrix.screen }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        screen: [delete_account, listing_edit, listing_wizard_2, listing_wizard_3, listing_wizard_3_empty, listing_division_sheet, change_price_slots]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.1" }
      - name: Debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Render only this screen (variants run in order; a hang stops at the first stuck variant)
        run: |
          set +e
          gradle :app:testDebugUnitTest -Proborazzi.test.record=true --tests "com.example.design.*" -PdesignOnly="${{ matrix.screen }}" -PdesignTimeoutMin=6 --no-daemon --stacktrace 2>&1 | tee gradle.log | tail -5
          echo "::notice title=diag-${{ matrix.screen }}::last=$(cat app/build/design-shots/_last.txt 2>/dev/null) pngs=$(ls app/build/design-shots/*.png 2>/dev/null | wc -l) errors=$(ls app/build/design-shots/*.error.txt 2>/dev/null | wc -l) timeout=$(grep -c 'Timeout has been exceeded' gradle.log)"
          for f in app/build/design-shots/*.error.txt; do [ -f "$f" ] && echo "::warning title=diag-${{ matrix.screen }}::$(basename $f): $(head -3 $f | tr '\n' ' ' | cut -c1-300)"; done
          exit 0
