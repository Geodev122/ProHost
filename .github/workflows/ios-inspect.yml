name: iOS Apple inspect

# Read-only snapshot of the Apple account (apps, bundle ID capabilities, latest builds, certificates, devices, profiles).
# Run from the Actions tab (needs the file on main) or by pushing a branch named `ios-inspect/<n>`.
on:
  workflow_dispatch:
  push:
    branches: ["ios-inspect/**"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install client dependencies
        run: pip install --quiet pyjwt cryptography
      - name: Snapshot
        run: python3 scripts/ios/asc_inspect.py
