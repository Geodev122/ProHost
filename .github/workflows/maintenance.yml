name: Maintenance (manual)

# Production maintenance with the CI service account — never runs on its own.
# Results appear as annotations on the run (counts and display codes only, no PII).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "audit (read-only) | j8 (data cleanup) | retiregrowth (remove old growth/enterprise plans) | occupancy (rebuild slot occupancy) | emailauth (why sign-in emails fail) | enableemaillink (turn on passwordless email sign-in) | mailtest (one test email to the owner) | clearstalesecrets (unblock function deploys) | mailingcode (set the website admin code) | playcatalog (live Play offers + lint, subscriptions, promo-code plumbing) | playofferfix (move a stranded promo offer to the live monthly plan, widen offer eligibility; code apply writes, else dry run) | igsetup (Instagram automation: store the IG_* GitHub secrets, verify the account, subscribe the webhook; code = control-room Sheet id) | igsmoke (Instagram webhook live check) | aiquota (global Claude Haiku 4.5 quota rows; code request files the increase request) | aiprobe (Claude on Vertex AI: which model/region works) | igtest (Instagram dry-run pipeline test with a synthetic comment and STOP DM) | smsauth (phone verification: SMS region policy, fingerprints; code allow:SY adds regions)"
        required: true
        default: audit
        type: choice
        options: [audit, prodcheck, playcatalog, playofferfix, smsauth, authorphans, mailingcode, mailingsmoke, igsetup, igsmoke, igtest, aiprobe, aiquota, j8, retiregrowth, occupancy, emailauth, enableemaillink, mailtest, clearstalesecrets]
      code:
        description: "mailingcode / mailingsmoke: the pro-host.tech/admin code (digits); playofferfix: apply (else dry run); smsauth: allow:SY (or empty to only read); other tasks ignore it"
        required: false
        default: ""

concurrency: production-maintenance

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Build functions
        working-directory: functions
        run: npm ci && npm run build

      - name: Write Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run ${{ inputs.task }}
        env:
          GCLOUD_PROJECT: prohost-f766f
          FIREBASE_CONFIG: '{"projectId":"prohost-f766f","storageBucket":"prohost-f766f.firebasestorage.app"}'
          TASK: ${{ inputs.task }}
          CODE: ${{ inputs.code }}
          PLAY_APP_SIGNING_SHA1: ${{ secrets.PLAY_APP_SIGNING_SHA1 }}
          PLAY_APP_SIGNING_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_VERIFY_TOKEN: ${{ secrets.IG_VERIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/maintenance/run.js "$TASK" "$CODE"
