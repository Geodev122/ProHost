name: Maintenance (manual)

# Production maintenance with the CI service account — never runs on its own.
# Results appear as annotations on the run (counts and display codes only, no PII).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "appcheck (read-only: share of callable calls with a valid App Check token per function; code = days, default 7) | reviewaccounts (App Review demo accounts: Specialist + Pro Host, passwords in server-only app_config/app_review, fills the App Store review form; code rotate = new passwords) | ipwhois (read-only: owner of an IPv4 address, code = the address) | audit (read-only) | activityaudit (read-only: who changed what in Cloud, code = days) | keysecurity (service-account keys with last-used dates; code apply disables the App Engine account's key) | j8 (data cleanup) | retiregrowth (remove old growth/enterprise plans) | occupancy (rebuild slot occupancy) | lifecycle (Storage retention: verification docs + booking agreements deleted after 365 days; code apply adds the rules, else shows them) | ttl (Firestore TTL policies for notifications.ttlAt and mail.expireAt; code apply creates them, else shows state) | favrecount (listing save counts from saved lists, owner excluded; code apply writes, else dry run) | emailauth (why sign-in emails fail) | enableemaillink (turn on passwordless email sign-in) | mailtest (one test email to the owner) | clearstalesecrets (unblock function deploys) | mailingcode (set the website admin code) | officeleadsmoke (one test lead through /list-your-office: address book tag, Leads queue, admin email) | playcatalog (live Play offers + lint, subscriptions, promo-code plumbing) | singleplan (create the single-listing Play subscription, $4.49 / $44.99; code apply creates it, else dry run) | unlimitedprice (Unlimited to $17.99 / $159.99 on Play, offers scaled, current subscribers keep their price; code apply writes, else dry run) | playofferfix (move a stranded promo offer to the live monthly plan, widen offer eligibility; code apply writes, else dry run) | igsetup (Instagram automation: store the IG_* GitHub secrets, verify the account, subscribe the webhook; code = control-room Sheet id) | igsmoke (Instagram webhook live check) | igmedia (read-only: latest Instagram posts and whether the token may publish) | igpublish (code = post11 / post12 / post13 / story / story_office / story_office_ar publishes that item from marketing/social/captions.json; empty = dry-run plan) | aitest (DM agent prompt on sample questions via Claude, sends nothing) |  igtest (Instagram dry-run pipeline test with a synthetic comment and STOP DM) | smsauth (phone verification: SMS region policy, fingerprints; code allow:SY adds regions)"
        required: true
        default: audit
        type: choice
        options: [audit, prodcheck, hostingcheck, ipwhois, iamaudit, activityaudit, keysecurity, apis, playcatalog, playofferfix, singleplan, unlimitedprice, applekey, applesync, reviewaccounts, appcheck, alerts, smsauth, authorphans, authuser, logerrors, authconfig, passwordinvites, integrity, mailingcode, mailingsmoke, officeleadsmoke, igsetup, igsmoke, igmedia, igpublish, igtest, aitest, j8, retiregrowth, occupancy, favrecount, ttl, lifecycle, emailauth, enableemaillink, mailtest, clearstalesecrets]
      code:
        description: "mailingcode / mailingsmoke: the pro-host.tech/admin code (digits); playofferfix: apply (else dry run); smsauth: allow:SY (or empty to only read); authuser: the Auth uid; logerrors: hours (default 48); authconfig: apply|retire; passwordinvites: send|resend; integrity: enable; other tasks ignore it"
        required: false
        default: ""

permissions:
  contents: write

concurrency: production-maintenance

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Build functions
        working-directory: functions
        run: npm ci && npm run build

      - name: Write Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run ${{ inputs.task }}
        env:
          GCLOUD_PROJECT: prohost-f766f
          FIREBASE_CONFIG: '{"projectId":"prohost-f766f","storageBucket":"prohost-f766f.firebasestorage.app"}'
          TASK: ${{ inputs.task }}
          CODE: ${{ inputs.code }}
          PLAY_APP_SIGNING_SHA1: ${{ secrets.PLAY_APP_SIGNING_SHA1 }}
          PLAY_APP_SIGNING_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_VERIFY_TOKEN: ${{ secrets.IG_VERIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
          APPLE_IAP_KEY_P8: ${{ secrets.APPLE_IAP_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/maintenance/run.js "$TASK" "$CODE"

      # reviewaccounts: the task put the Specialist login and the notes line (masked) into $GITHUB_ENV;
      # this fills App Store Connect's App Review form with them. Nothing is submitted for review.
      - name: Fill the App Review form (reviewaccounts)
        if: ${{ inputs.task == 'reviewaccounts' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet pyjwt cryptography
          python3 scripts/ios/asc_prepare.py --apply --only review
          python3 scripts/ios/asc_store_status.py | grep -iE "review|MISSING" || true

      - name: Commit saved marketing files (igmedia)
        if: ${{ inputs.task == 'igmedia' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/live
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "igmedia: current posts of the Instagram account (for design analysis)"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
