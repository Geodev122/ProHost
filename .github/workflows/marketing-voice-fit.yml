name: Marketing voice 1 fit (manual)

# Fits voice 1 (the Lebanese TTS line) onto his NATIVE mouth in a take where Veo said the same line
# (scripts/marketing/fit_voice.py: DTW alignment + Rubber Band stretch), with SyncNet choosing the take and correcting
# the timing where the voice is still early or late. Output <out>/<name>.mp4, committed to the branch it runs on.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "name:voice.wav:take.mp4,take.mp4 — several separated by ';' (repo paths)"
        required: true
        default: "hook:marketing/audio/voice1/hook.wav:marketing/avatar/clips/s1v_a.mp4,marketing/avatar/clips/s1v_b.mp4,marketing/avatar/clips/s1v_c.mp4,marketing/avatar/clips/s1v_d.mp4;cta1:marketing/audio/voice1/cta1.wav:marketing/avatar/clips/s5v_a.mp4,marketing/avatar/clips/s5v_b.mp4,marketing/avatar/clips/s5v_c.mp4,marketing/avatar/clips/s5v_d.mp4"
      out:
        description: "Output folder"
        required: false
        default: "marketing/avatar/dubbed"

permissions:
  contents: write

concurrency: marketing-voice-fit

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rubberband-cli libgl1 > /dev/null
          pip install --quiet torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers==0.32.2 transformers==4.48.0 decord==0.6.0 accelerate==0.26.1 einops==0.7.0 \
            omegaconf==2.3.0 opencv-python-headless==4.9.0.80 python_speech_features==0.6 librosa==0.10.1 \
            ffmpeg-python==0.2.0 imageio==2.31.1 imageio-ffmpeg==0.5.1 "huggingface-hub[cli]==0.30.2" numpy==1.26.4 \
            kornia==0.8.0 scenedetect==0.6.4 soundfile matplotlib more-itertools regex scipy
          git clone --quiet https://github.com/bytedance/LatentSync.git "$RUNNER_TEMP/LatentSync"
          cd "$RUNNER_TEMP/LatentSync"
          git checkout --quiet a229c3948406bc2cf6eaf4873e662e70c6a04746
          for repo in ByteDance/LatentSync-1.6 ByteDance/LatentSync-1.5 ByteDance/LatentSync; do
            huggingface-cli download "$repo" auxiliary/syncnet_v2.model auxiliary/sfd_face.pth --local-dir checkpoints > /dev/null 2>&1 && break
          done
          ls checkpoints/auxiliary/syncnet_v2.model || { echo "::error::SyncNet weights not found on Hugging Face"; exit 1; }
          python -c "import sys; sys.path.insert(0, '.'); import eval.syncnet, eval.syncnet_detect; print('syncnet imports ok')"
      - name: Fit
        env:
          JOBS: ${{ inputs.jobs }}
          FIT_OUT: ${{ inputs.out }}
        run: |
          set -o pipefail
          export SYNCNET_REPO="$RUNNER_TEMP/LatentSync"
          IFS=';' read -ra list <<< "$JOBS"
          for job in "${list[@]}"; do
            name="${job%%:*}"; rest="${job#*:}"; voice="${rest%%:*}"; takes="${rest#*:}"
            python -u scripts/marketing/fit_voice.py "$voice" "$name" "$takes" 2>&1 | grep -v "it/s\]$" | tee -a "$RUNNER_TEMP/fit.log"
          done
          while read -r l; do echo "::notice::$l"; done < <(grep -E '^fit .*(chose|correction)' "$RUNNER_TEMP/fit.log")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.out }}"
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Marketing: voice 1 fitted onto his mouth (SyncNet-checked)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 7)); done  # other marketing runs push too
          exit 1
