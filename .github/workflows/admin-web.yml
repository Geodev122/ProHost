name: Admin Web

# Builds the Admin Console web app (:adminWeb, Compose for Web / Kotlin/Wasm; migration plan P1) and smoke-tests it in Chromium
# (software GL): the shared UI must draw a canvas, Firebase JS must initialise, no console or page errors. Never deploys:
# the site deploy (site-deploy.yml) builds the same module into public/console/ when main changes.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "adminWeb/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/migration/web_smoke.js"
      - ".github/workflows/admin-web.yml"

permissions:
  contents: read

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          cache-read-only: false
      - name: Build the web distribution
        run: |
          set +e
          extra=""
          for i in 1 2 3; do
            gradle :adminWeb:wasmJsBrowserDistribution --no-daemon --stacktrace $extra 2>&1 | tee gradle-web.log
            code=${PIPESTATUS[0]}
            [ "$code" = 0 ] && break
            # A restored Gradle cache can list an artifact whose file the cache cleanup deleted ("Could not find
            # kotlin-stdlib-wasm-js-2.3.20.klib", 22 Nov 2026): drop that module from the cache and resolve again.
            for m in $(grep -oE "Could not find [A-Za-z0-9._-]+ \(([A-Za-z0-9._-]+):([A-Za-z0-9._-]+):" gradle-web.log | sed -E 's/.*\(([^:]+):([^:]+):/\1\/\2/' | sort -u); do
              echo "clearing cached module $m"
              rm -rf "$HOME/.gradle/caches/modules-2/files-2.1/${m%%/*}/${m#*/}" "$HOME/.gradle/caches/modules-2/metadata-2."*/descriptors/"${m%%/*}"/"${m#*/}"
            done
            extra="--refresh-dependencies --no-configuration-cache"
            echo "attempt $i failed (exit $code); retrying in 20 s in case of a transient dependency download error"
            sleep 20
          done
          exit $code
      - name: Show the distribution
        run: |
          d=adminWeb/build/dist/wasmJs/productionExecutable
          ls -la "$d"
          du -sh "$d"
      - name: Browser smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright >/dev/null && npx playwright install chromium --with-deps >/dev/null
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/migration/web_smoke.js adminWeb/build/dist/wasmJs/productionExecutable \
            --expect-title "ProHost Admin" --shot admin-web.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-web
          path: |
            admin-web.png
            gradle-web.log
            adminWeb/build/dist/wasmJs/productionExecutable
          retention-days: 7
