name: Build and Distribute Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This repo doesn't commit a Gradle wrapper (gradlew/gradle-wrapper.jar), so
      # install the exact version gradle/wrapper/gradle-wrapper.properties expects
      # and invoke `gradle` directly instead of `./gradlew`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # app/build.gradle.kts points the debug signing config at ${rootDir}/debug.keystore,
      # which is gitignored (never committed) — generate the standard Android debug
      # keystore here so a fresh checkout can still build a debug APK.
      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prohost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Only distribute on an actual push/manual run — not on every PR, to avoid
      # spamming testers with in-progress branch builds.
      - name: Distribute to Firebase App Distribution
        if: github.event_name != 'pull_request'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:646730915838:android:345a7e12d5994456c8eaaf"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Automated build from commit ${{ github.sha }} on ${{ github.ref_name }}.
