name: Build and Distribute Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This repo doesn't commit a Gradle wrapper (gradlew/gradle-wrapper.jar), so
      # install the exact version gradle/wrapper/gradle-wrapper.properties expects
      # and invoke `gradle` directly instead of `./gradlew`. Gradle 8.10.2 is the
      # version actually compatible with this project's AGP 8.8.1 + Kotlin 2.1.10 +
      # KSP 2.1.10-1.0.29 — the wrapper properties previously pinned Gradle 9.3.1,
      # which predates AGP 8.8.1's supported Gradle range entirely and was never
      # validated (the wrapper jar itself was never committed to this repo, so no
      # one had actually built with that version pin before this workflow's first
      # run surfaced it as a bizarre "Unclosed comment" error from KSP's stub
      # compiler on a file with no such syntax problem).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # app/build.gradle.kts points the debug signing config at ${rootDir}/debug.keystore,
      # which is gitignored (never committed) — generate the standard Android debug
      # keystore here so a fresh checkout can still build a debug APK.
      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # .env is git-ignored (see app/build.gradle.kts's secrets { } block, which reads
      # it via the Secrets Gradle Plugin) — without it, a CI-built APK ships whatever
      # placeholder .env.example has, and the map renders blank on every device that
      # installs a build distributed by this workflow. Add a MAPS_API_KEY repo secret
      # (Settings -> Secrets and variables -> Actions) with a real key restricted to
      # "Maps SDK for Android" to make this real; until then this step is a no-op and
      # the build falls back to .env.example's placeholder, same as any local build
      # without a real key.
      - name: Write .env for Maps API key
        if: ${{ secrets.MAPS_API_KEY != '' }}
        run: echo "MAPS_API_KEY=${MAPS_API_KEY}" > .env
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prohost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Only distribute on an actual push/manual run — not on every PR, to avoid
      # spamming testers with in-progress branch builds.
      - name: Distribute to Firebase App Distribution
        if: github.event_name != 'pull_request'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:646730915838:android:345a7e12d5994456c8eaaf"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Automated build from commit ${{ github.sha }} on ${{ github.ref_name }}.
