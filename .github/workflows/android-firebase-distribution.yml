name: Build and Distribute Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties pins the Gradle daemon to a JetBrains
      # JDK 21; any other JDK fails before the build starts.
      - name: Set up JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      # No Gradle wrapper jar is committed, so install Gradle directly. AGP 8.13
      # requires Gradle 8.13+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # app/build.gradle.kts points the debug signing config at ${rootDir}/debug.keystore,
      # which is gitignored (never committed) — generate the standard Android debug
      # keystore here so a fresh checkout can still build a debug APK.
      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # compileReleaseKotlin catches release-only compile errors (the shipped
      # variant) without needing the upload keystore.
      - name: Build debug APK and compile release
        run: gradle :app:assembleDebug :app:compileReleaseKotlin --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prohost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Only distribute on an actual push/manual run — not on every PR, to avoid
      # spamming testers with in-progress branch builds.
      - name: Distribute to Firebase App Distribution
        if: github.event_name != 'pull_request'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:646730915838:android:345a7e12d5994456c8eaaf"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Automated build from commit ${{ github.sha }} on ${{ github.ref_name }}.

  functions-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build
