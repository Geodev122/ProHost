name: Marketing Reel Studio (manual)

# One brief-driven reel, end to end, with the ProHost avatar and its two voices (scripts/marketing/reel_studio.py;
# .claude/skills/prohost-reel/SKILL.md). The spec lives in marketing/reels/<id>/spec.json; everything the run makes
# (keyframes, clips, voices, voice 1 fitted onto his mouth, reel.mp4, cover.jpg) is committed next to it on the branch it
# runs on. Stage all runs straight through to the finished reel.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec path, e.g. marketing/reels/my-reel/spec.json"
        required: true
      stage:
        description: "all, or one stage to redo (prepare = validate only, footage, check, voices, voice1, compose)"
        required: false
        default: all
        type: choice
        options: [all, prepare, footage, check, voices, voice1, compose]

permissions:
  contents: write

concurrency: marketing-reel-studio

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          # rubberband-cli: fit_voice.py stretches voice 1 onto his mouth syllable by syllable; torch + LatentSync's
          # eval code: SyncNet picks the take and corrects the timing (SYNCNET_REPO)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rubberband-cli libgl1 > /dev/null
          pip install --quiet torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers==0.32.2 transformers==4.48.0 decord==0.6.0 accelerate==0.26.1 einops==0.7.0 \
            omegaconf==2.3.0 opencv-python-headless==4.9.0.80 python_speech_features==0.6 librosa==0.10.1 \
            ffmpeg-python==0.2.0 imageio==2.31.1 imageio-ffmpeg==0.5.1 "huggingface-hub[cli]==0.30.2" numpy==1.26.4 \
            kornia==0.8.0 scenedetect==0.6.4 soundfile matplotlib more-itertools regex scipy google-auth requests playwright
          python -m playwright install --with-deps chromium > /dev/null
          git clone --quiet https://github.com/bytedance/LatentSync.git "$RUNNER_TEMP/LatentSync"
          git -C "$RUNNER_TEMP/LatentSync" checkout --quiet a229c3948406bc2cf6eaf4873e662e70c6a04746
          for repo in ByteDance/LatentSync-1.6 ByteDance/LatentSync-1.5 ByteDance/LatentSync; do
            huggingface-cli download "$repo" auxiliary/syncnet_v2.model auxiliary/sfd_face.pth \
              --local-dir "$RUNNER_TEMP/LatentSync/checkpoints" > /dev/null 2>&1 && break
          done
          if [ -f "$RUNNER_TEMP/LatentSync/checkpoints/auxiliary/syncnet_v2.model" ]; then
            echo "SYNCNET_REPO=$RUNNER_TEMP/LatentSync" >> "$GITHUB_ENV"
          else
            echo "::warning::SyncNet weights not found: voice 1 is fitted by rhythm only"
          fi
      - name: Write Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Produce
        env:
          SPEC: ${{ inputs.spec }}
          STAGE: ${{ inputs.stage }}
          CHROME: none
        run: |
          set -o pipefail
          case "$SPEC" in marketing/reels/*/spec.json) ;; *) echo "::error::spec must be marketing/reels/<id>/spec.json"; exit 1;; esac
          python -u scripts/marketing/reel_studio.py "$STAGE" "$SPEC" 2>&1 | tee "$RUNNER_TEMP/studio.log" || {
            echo "::error::$(tail -c 1500 "$RUNNER_TEMP/studio.log" | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice::$l"; done < <(grep -E '^(studio|clip |keyframe|voice1|fit |reel_office|.*\.mp4 \()' "$RUNNER_TEMP/studio.log" | tail -9)
      - name: Commit
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$(dirname "$SPEC")" marketing/source/reel_studio_data.js
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Marketing: Reel Studio $(basename "$(dirname "$SPEC")") (${{ inputs.stage }})"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 7)); done  # other marketing runs push too
          exit 1
