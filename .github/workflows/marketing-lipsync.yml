name: Marketing lip-sync (manual)

# Lip-syncs voice 1 (marketing/audio/voice1, from marketing-voice1.yml) onto the avatar's speaking takes with LatentSync 1.6
# (ByteDance, open source, 512 px) on a cloud GPU: a Vertex AI custom job in the Firebase project (L4, else T4 / A100,
# ~US$1 per run). The free runners can't: 2 CPUs and 7 GB RAM ran it out of memory. scripts/marketing/gpu_lipsync.py.
# Output: marketing/avatar/lipsync/<name>.mp4 + <name>_sheet.jpg + <name>_mouth.jpg, committed to the branch it runs on.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "name:audio:clip:video_from, comma-separated (e.g. hook:line_1:s1:0.1,cta1:line_5:s5_a:0.0)"
        required: true
        default: "hook:line_1:s1:0.1,cta1:line_5:s5_a:0.0"
      steps:
        description: "LatentSync inference steps (20 = the model's default; 30–50 = finer)"
        required: false
        default: "40"
      guidance:
        description: "Audio guidance (1.5 default; 2.0 = stronger mouth shapes)"
        required: false
        default: "1.5"

permissions:
  contents: write

concurrency: marketing-lipsync

jobs:
  lipsync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet google-auth requests numpy opencv-python-headless==4.10.0.84
      - name: Write Service Account Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Lip-sync on GPU
        env:
          JOBS: ${{ inputs.jobs }}
          STEPS: ${{ inputs.steps }}
          GUIDANCE: ${{ inputs.guidance }}
        run: |
          set -o pipefail
          python -u scripts/marketing/gpu_lipsync.py "$JOBS" "$STEPS" "$GUIDANCE" 2>&1 | tee "$RUNNER_TEMP/ls.log" || {
            echo "::error::$(tail -c 1500 "$RUNNER_TEMP/ls.log" | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice::$l"; done < <(grep -E '^lipsync' "$RUNNER_TEMP/ls.log")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/avatar/lipsync
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Marketing: lip-sync voice 1 on GPU (${{ inputs.jobs }})"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 7)); done  # other marketing runs push too
          exit 1
