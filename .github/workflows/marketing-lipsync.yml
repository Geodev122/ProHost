name: Marketing lip-sync (manual)

# Lip-syncs the AI avatar's clips to the owner's recorded voice with open-source models on CPU (free):
# Wav2Lip GAN for the mouth + GFPGAN for face detail, blended back only on the mouth/jaw (scripts/marketing/lipsync.py).
# Output: marketing/avatar/lipsync/<shot>.mp4 + <shot>_sheet.jpg, committed to the branch it runs on.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "shot:audio:video_from[:audio_from-audio_to], comma-separated (e.g. s1:line_1:0 or s5:line_5:0:0-5.6)"
        required: true
        default: "s1:line_1:0"

permissions:
  contents: write

concurrency: marketing-lipsync

jobs:
  lipsync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy==1.23.5 librosa==0.9.2 numba==0.56.4 opencv-python-headless==4.8.1.78 scipy tqdm \
            basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8
          git clone --quiet https://github.com/Rudrabha/Wav2Lip.git "$RUNNER_TEMP/Wav2Lip"
          mkdir -p "$RUNNER_TEMP/Wav2Lip/temp"

      - name: Model weights
        run: |
          set -e
          get() { # url... → first that downloads with a plausible size
            dest=$1; min=$2; shift 2
            for u in "$@"; do
              if curl -sSfL --retry 2 -o "$dest" "$u" && [ "$(stat -c %s "$dest")" -gt "$min" ]; then echo "got $(basename "$dest") from $u"; return 0; fi
            done
            echo "::error::could not download $(basename "$dest")"; return 1
          }
          get "$RUNNER_TEMP/wav2lip_gan.pth" 300000000 \
            https://huggingface.co/numz/wav2lip_studio/resolve/main/Wav2lip/wav2lip_gan.pth \
            https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/wav2lip_gan.pth \
            https://huggingface.co/Kedreamix/Linly-Talker/resolve/main/checkpoints/wav2lip_gan.pth \
            https://huggingface.co/Nekochu/Wav2Lip/resolve/main/wav2lip_gan.pth
          get "$RUNNER_TEMP/Wav2Lip/face_detection/detection/sfd/s3fd.pth" 80000000 \
            https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth \
            https://huggingface.co/numz/wav2lip_studio/resolve/main/Wav2lip/s3fd.pth \
            https://huggingface.co/camenduru/Wav2Lip/resolve/main/face_detection/detection/sfd/s3fd.pth
          get "$RUNNER_TEMP/GFPGANv1.4.pth" 300000000 \
            https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth

      - name: Lip-sync
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          set -o pipefail
          python -u scripts/marketing/lipsync.py "$RUNNER_TEMP/Wav2Lip" "$RUNNER_TEMP/wav2lip_gan.pth" "$RUNNER_TEMP/GFPGANv1.4.pth" "$JOBS" 2>&1 | tee "$RUNNER_TEMP/ls.log" || {
            echo "::error::$(tail -c 1500 "$RUNNER_TEMP/ls.log" | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice::$l"; done < <(grep -E '^lipsync' "$RUNNER_TEMP/ls.log")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/avatar/lipsync
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Marketing: lip-sync (${{ inputs.jobs }})"
          git pull --rebase
          git push
