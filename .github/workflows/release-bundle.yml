name: ProHost - Build Play-Signed Official Release Bundle

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  bundle-release:
    name: Build Signed Bundle & Upload Symbols
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Restore Upload Keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Official Release App Bundle & Crashlytics Symbols
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the STORE_PASSWORD and KEY_PASSWORD repository secrets (Settings › Secrets and variables › Actions) — the upload key can't be used without them."
            exit 1
          fi
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Add the MAPS_API_KEY repository secret — a release without it shows a blank map."
            exit 1
          fi
          # The R8 mapping file uploads to Crashlytics during bundleRelease (mappingFileUploadEnabled);
          # native symbols are zipped below for Play Console.
          gradle :app:bundleRelease :app:extractReleaseNativeSymbolTables --no-daemon --stacktrace

      - name: Zip Native Debug Symbols
        run: |
          mkdir -p app/build/outputs/native-debug-symbols/release
          if [ -d "app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib" ]; then
            cd app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
            zip -r "$GITHUB_WORKSPACE/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip" .
            cd -
          fi

      - name: Verify Bundle Signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prohost-release-${{ github.ref_name }}-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
