name: iOS TestFlight

# Manual: archive the app, sign it automatically with the App Store Connect API key and upload it to TestFlight.
# Secrets (GitHub > Settings > Secrets and variables > Actions): ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID and the key
# itself as ASC_KEY_P8 (raw multi-line PEM) or ASC_KEY_P8_B64 (base64). Values are never printed.
# Runs from the Actions tab (needs this file on main) or by pushing a branch named `ios-beta/<n>` (no merge needed).
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown to users (CFBundleShortVersionString)"
        default: "1.0.0"
  push:
    branches: ["ios-beta/**"]

concurrency: ios-testflight

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      MARKETING_VERSION_IN: ${{ github.event.inputs.marketing_version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are present
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_B64" ]; then missing="$missing ASC_KEY_P8"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing. See docs/IOS_PLAN.md section F."
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write API key to a temp file
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          RAW="${ASC_KEY_P8:-$ASC_KEY_P8_B64}" KEY="$KEY" python3 - <<'PY'
          import base64, os, re, subprocess, sys, textwrap
          raw = os.environ["RAW"].strip().replace("\\n", "\n").replace("\r", "")
          shape = f"length={len(raw)} lines={raw.count(chr(10)) + 1} has_begin={'BEGIN' in raw}"
          def pem(body):
              return "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          cands = []
          if "BEGIN" in raw:
              cands.append(raw + "\n")
          else:
              body = re.sub(r"\s+", "", raw)
              clean = re.sub(r"[^A-Za-z0-9+/=]", "", body)
              odd = sorted({repr(ch) for ch in body if not re.match(r"[A-Za-z0-9+/=]", ch)})
              shape += f" body_len={len(body)} clean_len={len(clean)} non_base64={odd} starts_MIGT={clean[:4] == 'MIGT'} ends_eq={clean.endswith('=')}"
              for v in (clean, clean[1:], clean[:-1], clean.rstrip("=")):
                  cands.append(pem(v))  # body only (base64 DER), plus variants
              try:  # base64 of a whole PEM file
                  dec = base64.b64decode(body, validate=False).decode("utf-8", "ignore")
                  if "BEGIN" in dec:
                      cands.insert(0, dec.strip() + "\n")
              except Exception:
                  pass
          path = os.environ["KEY"]
          def ok(c):
              open(path, "w").write(c)
              os.chmod(path, 0o600)
              return subprocess.run(["openssl", "pkey", "-check", "-in", path, "-noout"], capture_output=True).returncode == 0
          for c in cands:
              if ok(c):
                  print("ASC key parsed OK (" + shape + ")")
                  sys.exit(0)
          if "BEGIN" not in raw and len(clean) == 201:
              # One stray character (typical copy/paste slip): drop each position in turn; -check proves the key is consistent.
              for i in range(len(clean)):
                  if ok(pem(clean[:i] + clean[i + 1:])):
                      print(f"ASC key repaired: removed one stray character at position {i} (fix the secret later). " + shape)
                      sys.exit(0)
          os.remove(path)
          print("::error::ASC_KEY_P8 is not a usable .p8 key (" + shape + "). Paste the whole file text, BEGIN and END lines included.")
          sys.exit(1)
          PY
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Archive unsigned (development signing would need a registered device)
        working-directory: ios
        env:
          MARKETING_VERSION_IN: ${{ github.event.inputs.marketing_version }}
        run: |
          xcodebuild archive \
            -project ProHost.xcodeproj -scheme ProHost -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ProHost.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${MARKETING_VERSION_IN:-1.0.0}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export a local IPA and print its entitlements
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ProHost.xcarchive \
            -exportOptionsPlist ExportOptionsInspect.plist \
            -exportPath build/export-inspect \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -rf build/ipa && mkdir -p build/ipa && unzip -q build/export-inspect/ProHost.ipa -d build/ipa
          echo "--- signed entitlements"
          codesign -d --entitlements - --xml build/ipa/Payload/ProHost.app 2>/dev/null | plutil -p - | head -30
          echo "--- build number in the IPA"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/ipa/Payload/ProHost.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/ipa/Payload/ProHost.app/Info.plist
          echo "--- profile entitlements"
          security cms -D -i build/ipa/Payload/ProHost.app/embedded.mobileprovision > build/profile.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements" build/profile.plist | head -30
          echo "--- profile name and type"
          /usr/libexec/PlistBuddy -c "Print :Name" build/profile.plist
          /usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" build/profile.plist || true

      - name: Export and upload to App Store Connect
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ProHost.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
