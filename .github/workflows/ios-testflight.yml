name: iOS TestFlight

# Manual: archive the app, sign it automatically with the App Store Connect API key and upload it to TestFlight.
# Secrets (GitHub > Settings > Secrets and variables > Actions): ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID and the key
# itself as ASC_KEY_P8 (raw multi-line PEM) or ASC_KEY_P8_B64 (base64). Values are never printed.
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown to users (CFBundleShortVersionString)"
        default: "1.0.0"

concurrency: ios-testflight

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      MARKETING_VERSION_IN: ${{ github.event.inputs.marketing_version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are present
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_B64" ]; then missing="$missing ASC_KEY_P8"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing. See docs/IOS_PLAN.md section F."
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write API key to a temp file
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if [ -n "$ASC_KEY_P8" ]; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC key is not a PEM .p8 (no BEGIN PRIVATE KEY line)"; rm -f "$KEY"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (automatic signing via API key)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project ProHost.xcodeproj -scheme ProHost -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ProHost.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION_IN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to App Store Connect
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ProHost.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
