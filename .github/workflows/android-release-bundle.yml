name: Build Signed Release Bundle

# Builds the Play-signed-upload .aab from main (manual run) or from a v* tag.
# Required repository secrets:
#   UPLOAD_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   STORE_PASSWORD          keystore password
#   KEY_ALIAS               key alias (defaults to "upload" if unset)
#   KEY_PASSWORD            key password
#   MAPS_API_KEY            Google Maps key baked into the manifest
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          for v in STORE_PASSWORD KEY_PASSWORD MAPS_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is not set"; exit 1; fi
          done
          gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify bundle signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prohost-release-${{ github.ref_name }}-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
