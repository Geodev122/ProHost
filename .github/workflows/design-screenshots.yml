name: Design Screenshots

# Renders key screens in light, dark, font scale 1.3 and RTL (app/src/test/.../design/DesignScreenshotTest.kt)
# and uploads them, for reviewing design changes (docs/design/UI_AUDIT.md). Separate from CI/CD: it never gates
# a deploy.

on:
  workflow_dispatch: {}
  push:
    branches: [main, "claude/**"]
    paths:
      - "app/src/main/java/com/example/ui/**"
      - "app/src/main/res/**"
      - "app/src/test/java/com/example/design/**"
      - ".github/workflows/design-screenshots.yml"

concurrency:
  group: design-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render design screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Record screenshots
        run: gradle :app:recordRoborazziDebug --tests "com.example.design.*" --no-daemon --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-shots
          path: app/build/design-shots
          retention-days: 30
