name: Design Screenshots

# Renders key screens in light, dark, a 360 dp phone at the 1.15 text cap, RTL and Arabic (app/src/test/.../design/DesignScreenshotTest.kt)
# and uploads them, for reviewing design changes (docs/design/UI_AUDIT.md). Separate from CI/CD: it never gates
# a deploy.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated screen name prefixes to render (empty = all)"
        required: false
        default: ""
      settle:
        description: "Milliseconds the manual clock runs before the capture (default 1000); for experiments"
        required: false
        default: ""
      store_as:
        description: "Name of the stored ref (refs/design-shots/<name>); empty = the branch name. Used to freeze the golden baseline (docs/migration)."
        required: false
        default: ""


# contents: write only to store the PNGs as a commit under refs/design-shots/ (not a branch), so the images can be
# read through the GitHub API (git trees/blobs) where artifact downloads aren't reachable.
permissions:
  contents: write

concurrency:
  group: design-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render design screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install libfaketime (renders run at the golden's capture date; see app/build.gradle.kts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfaketime && ls /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1 && bash scripts/migration/fetch_design_photos.sh
      - name: Warm up Robolectric at the real time (downloads android-all; the frozen clock rejects newer TLS certificates)
        run: |
          # Seven jobs download the same new dependencies at once; Maven Central sometimes answers 429. Retry those, nothing else.
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest -Proborazzi.test.record=true --tests "com.example.design.*" -PdesignOnly=splash -PdesignRealTime=1 --no-build-cache --no-daemon -q > gradle-warmup.log 2>&1; then break; fi
            if [ "$attempt" -lt 3 ] && grep -qE "status code 429|Could not resolve|Could not GET" gradle-warmup.log; then
              echo "::warning title=warm-up::dependency download refused (attempt $attempt), retrying in $((attempt * 30)) s"; sleep $((attempt * 30)); continue
            fi
            echo "::error title=warm-up::Robolectric warm-up failed"; tail -40 gradle-warmup.log; exit 1
          done
          rm -rf app/build/design-shots
          # The frozen-clock render runs Robolectric offline from these jars, so it never opens a TLS connection.
          mkdir -p app/build/robolectric-deps
          find ~/.m2/repository/org/robolectric -name 'android-all*.jar' -exec cp {} app/build/robolectric-deps/ \;
          ls app/build/robolectric-deps | grep -q . || { echo "::error title=warm-up::no android-all jar found after the warm-up"; exit 1; }
          echo "::notice title=robolectric-deps::$(ls app/build/robolectric-deps | tr '\n' ' ')"
      - name: Record screenshots
        env:
          DESIGN_EXTRA_SETTLE_MS: ${{ inputs.settle }}
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest -Proborazzi.test.record=true --tests "com.example.design.*" -PdesignOnly="${{ inputs.only }}" --no-build-cache --no-daemon --stacktrace 2>&1 | tee gradle.log

      # Logs aren't readable from every client; surface compile errors as annotations instead.
      - name: Report compile errors
        if: failure()
        run: |
          grep -iE "^e: |error|FAILED|aapt" gradle.log | head -40 | while IFS= read -r line; do echo "::error title=build::${line}"; done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-shots
          path: app/build/design-shots
          retention-days: 30

      - name: Store screenshots as a git commit (refs/design-shots/<branch>)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d app/build/design-shots ] || exit 0
          cd app/build/design-shots
          git init -q
          git add -A
          git -c user.name="design-shots" -c user.email="design-shots@users.noreply.github.com" \
            commit -q -m "Design screenshots for ${GITHUB_SHA}"
          name="${{ inputs.store_as }}"
          [ -n "$name" ] || name="${GITHUB_REF_NAME//\//-}"
          ref="refs/design-shots/${name}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${ref}"
          echo "::notice title=design-shots::$(git rev-parse HEAD) ${ref} for ${GITHUB_SHA}"
