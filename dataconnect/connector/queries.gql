# --- Revenue queries (AdminRevenueScreen / OwnerAnalyticsScreen) ---
# Firestore's in-memory filtering handles date-range queries over every
# transaction poorly at scale; this runs as a real SQL WHERE clause against
# Postgres instead. `_aggregate` root fields (SUM/COUNT) aren't available in
# this schema/emulator version (confirmed against firebase dataconnect:compile
# — "Cannot query field whishTransactions_aggregate on type Query"), so the
# summary and per-owner breakdown are both computed client-side from this same
# already-server-filtered list — spaceId here joins against the already-cached
# SpaceListing.ownerId, no relationship directive needed in the schema for it.
query GetSuccessfulTransactionsInRange($startTimestamp: Int64!, $endTimestamp: Int64!) @auth(level: NO_ACCESS) {
  whishTransactions(
    where: { status: { eq: "SUCCESS" }, timestamp: { ge: $startTimestamp, le: $endTimestamp } }
    orderBy: { timestamp: DESC }
  ) {
    id
    spaceId
    spaceTitle
    amountUsd
    currency
    timestamp
    userId
  }
}

