# Mutations for ProSpace App

mutation UpsertAppUser(
  $id: String!
  $email: String!
  $fullName: String!
  $role: String!
  $specialty: String!
  $phone: String!
  $affiliation: String!
  $syndicateNumber: String!
  $governorate: String!
  $isVerified: Boolean!
  $subscriptionExpiryMillis: Int64
) {
  appUser_upsert(data: {
    id: $id
    email: $email
    fullName: $fullName
    role: $role
    specialty: $specialty
    phone: $phone
    affiliation: $affiliation
    syndicateNumber: $syndicateNumber
    governorate: $governorate
    isVerified: $isVerified
    subscriptionExpiryMillis: $subscriptionExpiryMillis
  })
}

mutation UpsertSpaceListing(
  $id: String!
  $title: String!
  $spaceType: String!
  $governorate: String!
  $district: String!
  $streetAddress: String!
  $floorInfo: String!
  $lat: Float!
  $lng: Float!
  $isShared: Boolean!
  $complementarySpecialties: [String!]!
  $residentPractitioners: [String!]!
  $essentialFacilities: [String!]!
  $equipmentJson: String!
  $rentalFormulasJson: String!
  $rulesJson: String!
  $scheduleJson: String!
  $ownerId: String!
  $ownerName: String!
  $ownerPhone: String!
  $ownerEmail: String!
  $isVerified: Boolean!
  $isActiveSubscription: Boolean!
  $subscriptionExpiryMillis: Int64!
  $imageUrls: [String!]!
  $videoTourDurationSec: Int!
  $baseMonthlyRateUsd: Float!
  $avatarEngagementViews: Int!
  $avatarInquiryClicks: Int!
  $subdivisionsJson: String
) {
  spaceListing_upsert(data: {
    id: $id
    title: $title
    spaceType: $spaceType
    governorate: $governorate
    district: $district
    streetAddress: $streetAddress
    floorInfo: $floorInfo
    lat: $lat
    lng: $lng
    isShared: $isShared
    complementarySpecialties: $complementarySpecialties
    residentPractitioners: $residentPractitioners
    essentialFacilities: $essentialFacilities
    equipmentJson: $equipmentJson
    rentalFormulasJson: $rentalFormulasJson
    rulesJson: $rulesJson
    scheduleJson: $scheduleJson
    ownerId: $ownerId
    ownerName: $ownerName
    ownerPhone: $ownerPhone
    ownerEmail: $ownerEmail
    isVerified: $isVerified
    isActiveSubscription: $isActiveSubscription
    subscriptionExpiryMillis: $subscriptionExpiryMillis
    imageUrls: $imageUrls
    videoTourDurationSec: $videoTourDurationSec
    baseMonthlyRateUsd: $baseMonthlyRateUsd
    avatarEngagementViews: $avatarEngagementViews
    avatarInquiryClicks: $avatarInquiryClicks
    subdivisionsJson: $subdivisionsJson
  })
}

mutation UpsertSpaceSubdivision(
  $id: String!
  $spaceId: String!
  $name: String!
  $type: String!
  $amenities: [String!]!
  $strategiesJson: String!
) {
  spaceSubdivision_upsert(data: {
    id: $id
    spaceId: $spaceId
    name: $name
    type: $type
    amenities: $amenities
    strategiesJson: $strategiesJson
  })
}

mutation DeleteSpaceSubdivision($id: String!) {
  spaceSubdivision_delete(id: $id)
}

