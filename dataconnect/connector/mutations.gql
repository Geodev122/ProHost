mutation InsertWhishTransaction(
  $id: String!
  $orderId: String!
  $amountUsd: Float!
  $currency: String!
  $status: String!
  $timestamp: Int64!
  $payerName: String!
  $payerPhone: String!
  $channelId: String!
  $sourceEmail: String!
  $signatureHash: String!
  $spaceId: String!
  $spaceTitle: String!
) {
  whishTransaction_insert(data: {
    id: $id
    orderId: $orderId
    amountUsd: $amountUsd
    currency: $currency
    status: $status
    timestamp: $timestamp
    payerName: $payerName
    payerPhone: $payerPhone
    channelId: $channelId
    sourceEmail: $sourceEmail
    signatureHash: $signatureHash
    spaceId: $spaceId
    spaceTitle: $spaceTitle
  })
}

