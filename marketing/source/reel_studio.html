<!doctype html><html lang="ar"><head><meta charset="utf-8">
<!-- Reel Studio overlay layer (transparent): any brief-driven reel (scripts/marketing/reel_studio.py). The footage is cut
     and moved by montage.py underneath; segments, captions, chips, CTA and end card come from the spec through
     window.REEL3 (reel_studio_data.js, written by reel_v3_compose.py). Prices only from offerClaims.ts ($8.99/month). -->
<style>
@font-face { font-family: "Cairo", "Inter", sans-serif; font-weight: 600; src: url("../social/assets/fonts/cairo-arabic-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Cairo", "Inter", sans-serif; font-weight: 800; src: url("../social/assets/fonts/cairo-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; src: url("../social/assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 800; src: url("../social/assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }
:root { --navy:#001f4e; --orange:#fd631d; --paper:#fefefc; --green:#25a35a; --red:#e2483d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
body { font-family: "Cairo", "Inter", sans-serif; color: #fff; position: relative; direction: rtl; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.lat { font-family: "Inter", sans-serif; direction: ltr; unicode-bidi: isolate; }
/* bottom gradient so captions read on any frame; top one for the logo */
#shadeB { left: 0; right: 0; bottom: 0; height: 760px; background: linear-gradient(180deg, rgba(0,20,52,0) 0%, rgba(0,20,52,.55) 55%, rgba(0,20,52,.8) 100%); }
#shadeT { left: 0; right: 0; top: 0; height: 420px; background: linear-gradient(0deg, rgba(0,20,52,0) 0%, rgba(0,20,52,.45) 100%); }
#dim { inset: 0; background: rgba(0,24,60,.62); opacity: 0; }
#logo { left: 60px; top: 260px; display: flex; align-items: center; gap: 12px; direction: ltr; padding: 12px 22px 12px 14px; border-radius: 999px; background: rgba(0,24,60,.55); }
#logo img { width: 46px; } #logo span { font: 800 36px/1 "Inter"; letter-spacing: -1.2px; }
#cap { left: 70px; right: 150px; top: 1360px; text-align: center; } /* clear of Reels' right-hand buttons and bottom bar */
#cap span { display: inline; background: rgba(0,18,46,.84); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 6px 22px; border-radius: 14px; font: 800 50px/1.66 "Cairo", "Inter", sans-serif; color: #fff; }
#cap b { color: var(--orange); font-weight: 800; }
#cap .w { opacity: .4; }
#cap .w.on { opacity: 1; }
.card { background: var(--paper); color: var(--navy); border-radius: 36px; box-shadow: 0 30px 80px rgba(0,8,30,.45); }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 14px 28px; border-radius: 999px; background: #fff; color: var(--navy); font: 800 36px/1.2 "Cairo", "Inter", sans-serif; box-shadow: 0 12px 30px rgba(0,8,30,.35); white-space: nowrap; }
.chip.o { background: var(--orange); color: var(--navy); }
.chip.g { background: var(--green); color: #fff; }
#chip { left: 60px; right: 150px; top: 1060px; display: flex; justify-content: center; opacity: 0; }
#chip .chip { font-size: 40px; padding: 18px 34px; white-space: normal; text-align: center; }
/* seg 5: comment "office" chip + free-month stamp */
#stamp { left: 600px; top: 1040px; width: 400px; height: 200px; border-radius: 32px; background: var(--orange); color: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 24px 60px rgba(253,99,29,.45); }
#stamp b { font: 800 62px/1.15 "Cairo", "Inter", sans-serif; } #stamp i { font: 800 32px/1.2 "Cairo", "Inter", sans-serif; font-style: normal; }
#bio { left: 60px; top: 1040px; }
/* CTA 1 (renters): get the app */
#app_unused { left: 60px; right: 60px; top: 1060px; display: flex; justify-content: center; }
#app .chip { font-size: 40px; padding: 18px 34px; }
/* CTA 2 (owners): a mock Instagram comment bar typing "office" + an arrow down to it */
#cbar { left: 60px; right: 60px; top: 1210px; height: 104px; border-radius: 999px; background: rgba(255,255,255,.96); box-shadow: 0 18px 50px rgba(0,8,30,.45); display: flex; align-items: center; gap: 18px; padding: 0 18px 0 26px; direction: ltr; }
#cbar .av { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #fd631d, #2B5A8C); flex: none; }
#cbar .tx { flex: 1; font: 600 40px/1 "Inter"; color: #102033; white-space: nowrap; overflow: hidden; }
#cbar .tx i { color: #8693a8; font-style: normal; }
#cbar .tx .cur { display: inline-block; width: 3px; height: 40px; background: #2B5A8C; vertical-align: middle; margin-left: 2px; }
#cbar .send { font: 800 34px/1 "Inter"; color: #2B5A8C; }
#arrow { left: 0; right: 0; top: 1110px; text-align: center; font: 800 84px/1 "Inter"; color: #fff; text-shadow: 0 6px 24px rgba(0,0,0,.45); }
/* seg 6: the price, then the end card */
#tag { left: 110px; right: 110px; top: 520px; padding: 36px; text-align: center; }
#tag .s { font: 800 40px/1.3 "Cairo", "Inter", sans-serif; color: #51607a; }
#tag .p { font: 800 168px/1 "Inter"; direction: ltr; color: var(--navy); letter-spacing: -6px; margin: 10px 0; }
#tag .p small { font-size: 58px; letter-spacing: -1px; color: #51607a; }
#tag .u { font: 800 40px/1.3 "Cairo", "Inter", sans-serif; color: var(--orange); }
#end { inset: 0; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; opacity: 0; }
#end .lg { display: flex; align-items: center; gap: 22px; direction: ltr; } #end .lg img { width: 130px; } #end .lg span { font: 800 110px/1 "Inter"; letter-spacing: -4px; }
#end .t { font: 800 64px/1.3 "Cairo", "Inter", sans-serif; text-align: center; padding: 0 80px; }
#end .t b { color: var(--orange); }
#end .k { font: 800 46px/1.3 "Cairo", "Inter", sans-serif; color: rgba(255,255,255,.85); }
#end .k b { color: var(--orange); font-family: "Inter"; }
#end .r { font: 600 30px/1.3 "Inter"; color: rgba(255,255,255,.6); direction: ltr; }
#ai { right: 60px; top: 1830px; font: 600 22px/1 "Inter"; color: rgba(255,255,255,.55); direction: ltr; }
</style></head><body>
<div class="abs" id="shadeT"></div><div class="abs" id="shadeB"></div><div class="abs" id="dim"></div>
<div class="abs" id="logo"><img src="assets/mark.png" alt=""><span>ProHost</span></div>
<div class="abs" id="chip"><span class="chip"></span></div>
<div class="abs" id="stamp"><b></b><i></i></div>
<div class="abs" id="bio"><span class="chip g">💬 Comment <span class="lat kw"></span></span></div>
<div class="abs" id="arrow">⬇</div>
<div class="abs" id="cbar"><div class="av"></div><div class="tx"><span class="typed"></span><span class="cur"></span></div><div class="send">Post</div></div>
<div class="abs card" id="tag"><div class="s"></div><div class="p">$8.99<small> /month</small></div><div class="u"></div></div>
<div class="abs" id="cap"><span></span></div>
<div class="abs" id="ai">AI-generated presenter</div>
<div class="abs" id="end">
  <div class="lg"><img src="assets/mark.png" alt=""><span>ProHost</span></div>
  <div class="t"></div><div class="k"></div><div class="r"></div>
</div>

<script src="engine.js"></script>
<script src="reel_studio_data.js" onerror="0"></script>
<script>
const R = window.REEL3 || { segs: [{ role: "a", t0: 0, t1: 5, sp: [0.2, 4.6], cap: "", phrases: [], in: "cut", cut: 0 }], end: 5, length: 6, endcard: {} };
const END = R.end, EC = R.endcard || {};
document.querySelector("#end .t").innerHTML = EC.title || "";
document.querySelector("#end .k").innerHTML = EC.sub || "";
document.querySelector("#end .r").textContent = EC.url || "pro-host.tech";
const events = [];
const SP = (s) => s.sp[0], SE = (s) => s.sp[1];
// Per segment: a chip, an Instagram comment bar typing a keyword, a stamp, or the price card — each optional.
R.segs.forEach((s) => {
  if (s.chip) {
    L((t) => { if (t >= s.t0 && t < s.t1) document.querySelector("#chip .chip").innerHTML = s.chip; });
    pop("#chip", SP(s) + 0.6, 0.5); fadeOut("#chip", s.t1 - 0.25, 0.25);
    events.push({ t: SP(s) + 0.6, k: "pop" });
  }
  if (s.comment) {
    const kw = s.comment, at = SP(s) + 1.1;
    L((t) => {
      if (t < s.t0 || t >= s.t1) return;
      document.querySelector("#bio .kw").textContent = kw;
      const k = Math.max(0, Math.min(kw.length, Math.floor((t - at) / 0.16)));
      document.querySelector("#cbar .typed").innerHTML = k ? kw.slice(0, k) : "<i>Add a comment…</i>";
      document.querySelector("#cbar .cur").style.opacity = Math.floor(t * 2.5) % 2 ? 1 : 0;
      document.querySelector("#bio .chip").style.transform = `scale(${1 + 0.06 * Math.max(0, Math.sin(t * 6.3))})`;
      document.getElementById("arrow").style.transform = `translateY(${14 * Math.abs(Math.sin(t * 4.2))}px)`;
    });
    pop("#bio", SP(s) + 0.3, 0.45); fadeUp("#cbar", SP(s) + 0.6, 0.45, 50); fadeIn("#arrow", SP(s) + 0.9, 0.3);
    fadeOut("#bio, #cbar, #arrow", s.t1 - 0.25, 0.3);
    events.push({ t: SP(s) + 0.3, k: "pop" }, ...[...kw].map((_, i) => ({ t: at + i * 0.16, k: "tap" })));
  }
  if (s.stamp) {
    const at = Math.max(SP(s) + 2.0, SE(s) - 1.6);
    L((t) => { if (t >= s.t0 && t < s.t1) { document.querySelector("#stamp b").innerHTML = s.stamp; document.querySelector("#stamp i").innerHTML = s.stamp_sub || ""; } });
    pop("#stamp", at, 0.55); fadeOut("#stamp", s.t1 - 0.25, 0.3);
    events.push({ t: at, k: "success" });
  }
  if (s.price) {
    L((t) => { if (t >= s.t0) { document.querySelector("#tag .s").innerHTML = s.price.label || ""; document.querySelector("#tag .u").innerHTML = s.price.note || ""; } });
    A("#dim", s.t0, 0.4, (e) => ({ opacity: e }), "out");
    pop("#tag", SP(s) + 1.0, 0.6);
    events.push({ t: SP(s) + 1.0, k: "pop" });
  }
  if (s.in && s.in !== "cut") events.push({ t: s.cut, k: "whoosh" });
});
A("#end", END, 0.45, (e) => ({ opacity: e }), "out");
events.push({ t: END, k: "impact" });
L((t) => { const v = t < END ? 1 : 0; ["logo", "ai"].forEach((id) => document.getElementById(id).style.opacity = v); });
// Captions: the segment's spoken line while it is spoken (+ a short hold); words light up as they are said.
const words = (html) => {
  // Whitespace-separated words, each kept whole with its punctuation and its part of a bold run ("و<b>مصاري</b>").
  let bold = false;
  return html.split(/\s+/).filter(Boolean).map((w) => {
    const open = bold;
    (w.match(/<\/?b>/g) || []).forEach((tag) => { bold = tag === "<b>"; });
    return (open ? "<b>" : "") + w + (bold ? "</b>" : "");
  });
};
L((t) => {
  const i = R.segs.findIndex((s) => t >= s.sp[0] - 0.1 && t < Math.min(s.t1, s.sp[1] + 0.6));
  const cap = document.getElementById("cap"), span = cap.firstElementChild;
  if (i < 0 || t >= END || !R.segs[i].cap) { cap.style.opacity = 0; return; }
  const s = R.segs[i];
  if (span.dataset.i !== String(i)) {
    const ws = words(s.cap), len = (w) => w.replace(/<\/?b>/g, "").length + 1, total = ws.reduce((n, w) => n + len(w), 0);
    let acc = 0;
    span.innerHTML = ws.map((w) => { const at = s.sp[0] + (s.sp[1] - s.sp[0]) * acc / total; acc += len(w);
      return `<span class="w" data-at="${at.toFixed(3)}">${w}</span>`; }).join(" ");
    span.dataset.i = i;
  }
  span.querySelectorAll(".w").forEach((w) => {
    const d = t - parseFloat(w.dataset.at);
    w.classList.toggle("on", d >= 0);
  });
  const f = Math.min(1, (t - s.sp[0] + 0.1) / 0.2);
  cap.style.opacity = f; cap.style.transform = `translateY(${(1 - f) * 20}px)`;
});
window.EVENTS = events;
render(0);
</script>
</body></html>
