<title>ProHost Lead Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar; a numbered pipeline rail (the real 1→9 agent sequence) beside the working panel; on phones the rail becomes a scrolling strip. */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --sunken: #ECF0F5; --line: #DAE0E8; --line-strong: #C3CDD9;
  --ink: #172231; --muted: #566377; --faint: #8592A4;
  --brand: #2B5A8C; --brand-ink: #FFFFFF; --brand-soft: #E5EDF6; --brand-line: #B7CBE1;
  --host: #D2470E; --host-ink: #FFFFFF;
  --good: #1C7046; --good-soft: #E0F1E7; --warn: #8A5200; --warn-soft: #FAEED7; --bad: #B3261E; --bad-soft: #FBE5E3;
  --display: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 10px; --toph: 66px;
  --shadow: 0 1px 2px rgba(23,34,49,.05), 0 10px 28px -18px rgba(23,34,49,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131B; --surface: #141C27; --sunken: #1A2431; --line: #263345; --line-strong: #37475C;
    --ink: #E3E9F1; --muted: #9AA7B8; --faint: #6F7C8E;
    --brand: #93B8E0; --brand-ink: #0D131B; --brand-soft: #1A2A3B; --brand-line: #345070;
    --host: #FF8A57; --host-ink: #1A0E07;
    --good: #6FD39C; --good-soft: #132B1E; --warn: #F2BE63; --warn-soft: #33270F; --bad: #FF9289; --bad-soft: #3A1A1C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131B; --surface: #141C27; --sunken: #1A2431; --line: #263345; --line-strong: #37475C;
  --ink: #E3E9F1; --muted: #9AA7B8; --faint: #6F7C8E;
  --brand: #93B8E0; --brand-ink: #0D131B; --brand-soft: #1A2A3B; --brand-line: #345070;
  --host: #FF8A57; --host-ink: #1A0E07;
  --good: #6FD39C; --good-soft: #132B1E; --warn: #F2BE63; --warn-soft: #33270F; --bad: #FF9289; --bad-soft: #3A1A1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; line-height: 1.2; font-weight: 800; }
h2 { font-size: 1.08rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--brand); }
code, .mono { font-family: var(--mono); font-size: .86em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; flex: none; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 1rem; white-space: nowrap; }
.brand-sub { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.savepill { font-size: .78rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken); white-space: nowrap; }
.savepill i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; }
.savepill[data-s="saved"] i { background: var(--good); }
.savepill[data-s="saving"] i { background: var(--warn); }
.savepill[data-s="error"] i { background: var(--bad); }

/* shell */
.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 0; min-height: calc(100vh - var(--toph)); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding-block: 14px; padding-inline: 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph)); align-self: start; max-height: calc(100vh - var(--toph)); overflow-y: auto; }
.rail-label { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 4px; font-weight: 600; }
.step { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: start; text-align: left; width: 100%; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.step:hover { background: var(--sunken); }
.step.is-active { background: var(--brand-soft); }
.step-n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-family: var(--mono); font-size: .72rem; color: var(--muted); background: var(--surface); margin-top: 1px; }
.step.is-done .step-n { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.step.is-active .step-n { border-color: var(--brand); color: var(--brand); }
.step.is-active.is-done .step-n { color: var(--brand-ink); }
.step-name { display: block; font-weight: 600; font-size: .88rem; line-height: 1.3; }
.step-stat { display: block; font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.is-active .step-name { color: var(--brand); }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 8px 6px; width: auto; }

main { padding-block: 24px 64px; padding-inline: 28px; min-width: 0; }
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .top { position: static; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-direction: row; overflow-x: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; gap: 4px; }
  .rail-label, .rail hr { display: none; }
  .step { grid-template-columns: 22px auto; width: auto; flex: none; padding: 6px 10px; align-items: center; }
  .step-n { width: 22px; height: 22px; margin: 0; }
  .step-stat { display: none; }
  .step-name { white-space: nowrap; }
  main { padding-inline: 16px; padding-block: 18px 56px; }
}

/* panel pieces */
.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--brand); font-weight: 700; font-family: var(--mono); }
.lede { color: var(--muted); max-width: 68ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0,1fr); } }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .86rem; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.host { background: var(--host); border-color: var(--host); color: var(--host-ink); }
.btn.host:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--brand); padding-inline: 8px; }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.sm { padding: 5px 10px; font-size: .8rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: .8rem; color: var(--muted); font-weight: 600; min-width: 0; }
input[type=text], input[type=url], input[type=number], select, textarea {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: .9rem; color: var(--ink); width: 100%; min-width: 0; font-weight: 400;
}
textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
textarea.code { font-family: var(--mono); font-size: .8rem; min-height: 280px; }
input[type=number] { width: 96px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--brand); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); font-size: .78rem; color: var(--ink); max-width: 100%; }
.chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 0 0 2px; font-size: .9rem; line-height: 1; }
.chip.brand { background: var(--brand-soft); border-color: var(--brand-line); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--brand-soft); color: var(--brand); }
.pill.mute { background: var(--sunken); color: var(--muted); }
.pill.plain::before { display: none; }

dl.kv { display: grid; grid-template-columns: 170px minmax(0,1fr); gap: 10px 18px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: .8rem; font-weight: 600; padding-top: 1px; }
dl.kv dd { margin: 0; min-width: 0; }
dl.kv ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
@media (max-width: 640px) { dl.kv { grid-template-columns: minmax(0,1fr); gap: 2px; } dl.kv dd { margin-bottom: 10px; } }

.banner { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner > span:first-child { flex: 1 1 320px; min-width: 0; }
.banner b { color: var(--warn); }
.note { border-left: 3px solid var(--brand-line); padding: 4px 0 4px 12px; color: var(--muted); font-size: .84rem; }
.err { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: .86rem; }
.empty { text-align: left; padding: 22px; border: 1px dashed var(--line-strong); border-radius: var(--r); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--surface); }

pre.copybox { margin: 0; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: .78rem; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }

/* funnel */
.funnel { display: flex; flex-direction: column; gap: 10px; }
.frow { display: grid; grid-template-columns: 170px minmax(0,1fr) 72px; gap: 14px; align-items: center; }
.frow .lab { font-weight: 600; font-size: .86rem; }
.frow .lab small { display: block; color: var(--muted); font-weight: 400; font-size: .74rem; }
.frow .val { text-align: right; font-family: var(--mono); font-weight: 600; font-size: .95rem; }
.track { height: 10px; background: var(--sunken); border-radius: 0 4px 4px 0; position: relative; }
.track span { position: absolute; inset: 0 auto 0 0; background: var(--brand); border-radius: 0 4px 4px 0; min-width: 2px; }
@media (max-width: 560px) { .frow { grid-template-columns: minmax(0,1fr) 64px; } .frow .track { grid-column: 1 / -1; order: 3; } }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: .84rem; }
table.t th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--sunken); white-space: nowrap; }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: var(--sunken); }
table.t td.n { font-family: var(--mono); text-align: right; white-space: nowrap; }
.who b { display: block; font-weight: 600; }
.who span { color: var(--muted); font-size: .8rem; }
.score { display: inline-grid; place-items: center; min-width: 38px; padding: 2px 6px; border-radius: 6px; font-family: var(--mono); font-weight: 600; font-size: .84rem; background: var(--sunken); color: var(--muted); }
.score.hi { background: var(--good-soft); color: var(--good); }
.score.mid { background: var(--warn-soft); color: var(--warn); }

/* job progress */
.job { border: 1px solid var(--brand-line); background: var(--brand-soft); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.bar { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--brand); transition: width .3s ease; }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

/* emails */
.mail { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; min-width: 0; }
.mail-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sunken); border-radius: 8px 8px 0 0; flex-wrap: wrap; }
.mail-h b { font-size: .8rem; }
.mail-h .wc { font-family: var(--mono); font-size: .74rem; color: var(--muted); }
.mail-b { padding: 12px; white-space: pre-wrap; font-size: .88rem; line-height: 1.6; word-break: break-word; }
.mails { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
@media (max-width: 1100px) { .mails { grid-template-columns: minmax(0,1fr); } }

/* score breakdown */
.parts { display: flex; flex-direction: column; gap: 7px; }
.part { display: grid; grid-template-columns: 120px minmax(0,1fr) 56px; gap: 10px; align-items: center; font-size: .82rem; }
.part .track { height: 8px; }
.part .v { font-family: var(--mono); text-align: right; color: var(--muted); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,16,24,.38); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); border-left: 1px solid var(--line); z-index: 41; overflow-y: auto; padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 40px); padding-inline: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
@media (max-width: 640px) { .drawer { padding-inline: 16px; } }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .86rem; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: var(--sunken); }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.maptable select { min-width: 160px; }
.seg { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
details > summary { cursor: pointer; font-weight: 600; color: var(--brand); }
details[open] > summary { margin-bottom: 10px; }
.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
</style>

<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true">P</div>
    <div style="min-width:0">
      <div class="brand-name">ProHost Lead Engine</div>
      <div class="brand-sub" id="brandSub">Company → ICP → leads → research → emails → Excel</div>
    </div>
  </div>
  <div class="top-right">
    <span class="savepill" id="savePill" data-s="idle"><i></i><span>Loading…</span></span>
    <button class="btn host sm" data-act="export" id="topExport">Download Excel</button>
  </div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Pipeline"></nav>
  <main id="main"><div class="wrap"><div class="empty"><h2>Loading the engine…</h2><p class="muted">Reading your company profile, targeting rules and leads.</p></div></div></main>
</div>
<div id="drawerRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {

function compileIcp(icp) {

    adjacent: mk(icp?.adjacent_keywords), exclude: mk(icp?.exclude_keywords),

    signals: mk(icp?.signal_keywords),

}
function roleTier(title, C) {

  if (C.exTitles.some(x => x.re.test(t))) return { f: 0, tier: 'Excluded title' };
  if (C.decision.some(x => x.re.test(t))) return { f: 1, tier: 'Decision maker' };
  if (C.operator.some(x => x.re.test(t))) return { f: 0.8, tier: 'Runs operations' };
  if (/(^|[^a-z])(director|head|vp|vice president|chief)([^a-z]|$)/.test(t)) return { f: 0.6, tier: 'Director' };
  if (/(^|[^a-z])manager([^a-z]|$)/.test(t)) return { f: 0.4, tier: 'Manager' };
  return { f: 0.1, tier: 'Other role' };
}
function sizeFrac(n, e) {
  if (n == null) return 0.4;
  const min = +e.min || 1, smin = +e.sweet_min || 5, smax = +e.sweet_max || 500, max = +e.max || 5000;
  if (n >= smin && n <= smax) return 1;
  if (n >= min && n <= max) return 0.6;
  return 0.2;
}
function normWeights(w) {
  const o = {}; let sum = 0;
  for (const k of Object.keys(DEFAULT_OUT.weights)) { o[k] = Math.max(0, Number(w?.[k]) || 0); sum += o[k]; }
  if (!sum) return { ...DEFAULT_OUT.weights };
  for (const k in o) o[k] = o[k] * 100 / sum;

}
function scoreLead(L, C, W, ai) {

  let best = null, bestHits = 0, bestInd = 0;
  for (const seg of C.segments) {
    let hits = 0, ind = 0;
    for (const x of seg.res) if (x.re.test(hayAll)) { hits++; if (x.re.test(hayInd)) ind++; }
    if (hits > bestHits || (hits === bestHits && hits > 0 && ind > bestInd)) { best = seg; bestHits = hits; bestInd = ind; }
  }
  const excluded = C.exclude.some(x => x.re.test(hayAll));
  const adjacent = !bestHits && C.adjacent.some(x => x.re.test(hayAll));
  const indF = excluded ? 0 : bestInd > 0 ? 1 : bestHits > 0 ? 0.7 : adjacent ? 0.4 : 0;
  const countryOk = C.countries.has(L.country);
  const icpF = ((countryOk ? 15 : 0) + (excluded ? 0 : bestHits > 0 ? 15 : adjacent ? 6 : 0) + (L.domain ? 5 : 0) + (L.linkedin ? 5 : 0)) / 40;
  const role = roleTier(L.title, C);
  const sizeF = sizeFrac(L.employees, C.emp);

  const researchSignal = ai?.research?.signal_source === 'data' && ai.research.signal;
  const actF = (dataSignal || researchSignal) ? 1 : 0;
  const parts = { icp: icpF * W.icp, industry: indF * W.industry, role: role.f * W.role, size: sizeF * W.size, activity: actF * W.activity };
  const total = Math.round(Object.values(parts).reduce((a, b) => a + b, 0));
  return { total, parts, segment: best?.name || (adjacent ? 'Adjacent industry' : ''), roleTier: role.tier, countryOk, excluded,

function emailCheck(L, seen) {
  const e = lc(L.email);
  if (!e) return { status: 'missing', note: 'No email in the record' };
  if (!EMAIL_RE.test(e)) return { status: 'invalid', note: 'Not a valid address' };
  const [local, domain] = e.split('@');
  if (/not_unlocked|notunlocked/.test(local) || domain === 'domain.com') return { status: 'invalid', note: 'Locked placeholder from the export' };
  if (DISPOSABLE.has(domain)) return { status: 'invalid', note: 'Disposable domain' };
  if (ROLE_LOCAL.has(local.replace(/[0-9]+$/, ''))) return { status: 'role', note: 'Role mailbox (' + local + '@)' };
  if (seen.has(e)) return { status: 'duplicate', note: 'Same address as ' + seen.get(e) };
  seen.set(e, leadName(L) || L.company || 'another row');
  const p = providerStatus(L.emailStatus);
  if (p === 'invalid') return { status: 'invalid', note: 'Verifier: ' + L.emailStatus };

/* batch runner: sequential batches, two at a time, started by a click, stoppable */
async function applyBatch(phase, batch, out) {
  const list = Array.isArray(out) ? out : (Array.isArray(out?.leads) ? out.leads : []);
  const want = new Set(batch.map(r => r.L.key));
  let ok = 0;
  for (const o of list) {
    const key = str(o?.key); if (!want.has(key)) continue;
    const cur = S.ai[key] || { k: key };
    if (phase === 'research') {
      cur.research = { signal: str(o.signal).slice(0, 300), signal_source: o.signal_source === 'data' && str(o.signal) ? 'data' : 'none',
        pain_point: str(o.pain_point).slice(0, 200), reason_selected: str(o.reason_selected).slice(0, 400), summary: str(o.summary).slice(0, 300) };
    } else {
      if (!str(o.variant_a) && !str(o.variant_b) && !str(o.variant_c)) continue;
      cur.emails = { subject: str(o.subject).slice(0, 120), a: str(o.variant_a).slice(0, 1200), b: str(o.variant_b).slice(0, 1200), c: str(o.variant_c).slice(0, 1200) };
    }
    cur.at = Date.now(); S.ai[key] = cur; want.delete(key); ok++;
    await saveAi(key);
  }
  return ok;
}
async function runBatches(phase, rows, size) {
  const batches = chunk(rows, size); let i = 0; let fails = 0;
  S.job.phase = phase; renderJob();
  const worker = async () => {
    while (!S.job.stop && i < batches.length) {
      const b = batches[i++]; const ctl = new AbortController(); S.job.ctls.add(ctl);
      try {
        const prompt = phase === 'research' ? promptResearch(b) : promptEmails(b);
        const out = await S.sample.json(prompt, { modelTier: phase === 'research' ? 'quick' : 'default', signal: ctl.signal });
        const ok = await applyBatch(phase, b, out);
        S.job.done += b.length; S.job.failed += b.length - ok; fails = 0;
      } catch (e) {
        if (e?.code === 'cancelled') { S.job.stop = true; break; }
        if (FATAL.has(e?.code)) { S.job.stop = true; S.job.error = sampleErr(e); break; }
        S.job.done += b.length; S.job.failed += b.length; fails++;
        if (fails >= 3) { S.job.stop = true; S.job.error = 'Three batches in a row failed (' + (e?.code || 'error') + '). Finished work is saved; run it again to continue.'; }
      } finally {
        S.job.ctls.delete(ctl); derive(); renderJob(); renderRail();
      }
    }
  };
  await Promise.all([worker(), worker()]);
}

function autoMap(headers) {
  const nh = headers.map(h => ({ h, n: nkey(h) })); const map = {}; const used = new Set();
  for (const f of FIELDS) {
    for (const a of f.al) { const hit = nh.find(x => x.n === a && !used.has(x.h)); if (hit) { map[f.k] = hit.h; used.add(hit.h); break; } }
  }
  return map;
}
const autoSignals = headers => headers.filter(h => SIGNAL_HINTS.some(s => nkey(h).includes(s)));
function guessSource(headers) {
  const n = headers.map(nkey);
  if (n.includes('apollocontactid') || n.includes('personlinkedinurl') || n.includes('companynameforemails')) return 'Apollo';
  if (n.includes('jobcompanyname') || n.includes('workemail') && n.includes('fullname')) return 'People Data Labs';
  return 'Import';
}
function flattenJson(rec) {
  const o = {};
  for (const [k, v] of Object.entries(rec || {})) {
    if (v == null) continue;
    if (Array.isArray(v)) { const s = v.filter(x => typeof x !== 'object').join(', '); if (s) o[k] = s; }
    else if (typeof v !== 'object') o[k] = String(v);
  }
  return o;
}
async function readTable(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.json')) {
    const j = JSON.parse(await file.text());
    const list = Array.isArray(j) ? j : Array.isArray(j?.data) ? j.data : Array.isArray(j?.people) ? j.people : [];
    const rows = list.map(flattenJson);
    const headers = [...new Set(rows.flatMap(r => Object.keys(r)))];
    return { rows, headers };
  }
  if (!window.XLSX) throw new Error('The spreadsheet reader did not load. Reload the page and try again.');
  const wb = /\.(csv|tsv|txt)$/.test(name) ? XLSX.read(await file.text(), { type: 'string', raw: true }) : XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false });
  const headers = (aoa[0] || []).map((h, i) => norm(h) || 'Column ' + (i + 1));
  const rows = aoa.slice(1).map(a => { const o = {}; headers.forEach((h, i) => { o[h] = a[i] == null ? '' : String(a[i]); }); return o; });
  return { rows, headers };
}

function rowToLead(r, map, sigCols, source) {
  const g = k => map[k] ? norm(r[map[k]]) : '';

    industry: g('industry').slice(0, 120), employees: parseEmp(g('employees')),

    firstName: first.slice(0, 60), lastName: last.slice(0, 60), name: name.slice(0, 120), title: g('title').slice(0, 160),

async function doImport() {
  const im = S.import; if (!im || S.busy.import) return;
  S.busy.import = true; render();
  const incoming = []; const seenKeys = new Set();
  for (const r of im.rows) {
    const L = rowToLead(r, im.map, im.signals, im.source);
    if (!leadName(L) && !L.email && !L.company) continue;
    if (seenKeys.has(L.key)) continue; seenKeys.add(L.key); incoming.push(L);
  }
  const replace = im.mode === 'replace' || S.meta.example;
  let next;
  if (replace) next = incoming;
  else {
    const m = new Map(S.leads.map(L => [L.key, L]));
    for (const L of incoming) { const cur = m.get(L.key); if (cur) { for (const k in L) if (L[k] !== '' && L[k] != null) cur[k] = L[k]; } else m.set(L.key, L); }
    next = [...m.values()];
  }
  if (next.length > 20000) { S.busy.import = false; S.msg.import = 'This would hold ' + fmt(next.length) + ' leads; the engine keeps up to 20,000. Split the file or replace instead of adding.'; render(); return; }
  const removed = Object.keys(S.ai).filter(k => !next.some(L => L.key === k));
  S.leads = next; S.import = null;
  const saved = await saveLeads({ example: false, source: im.source, lastImport: { file: im.fileName, rows: incoming.length, at: Date.now() } });
  if (replace && removed.length) {
    const keep = new Set(next.map(L => L.key));
    for (const k of Object.keys(S.ai)) if (!keep.has(k)) { delete S.ai[k]; if (canWrite()) { try { await dbw(() => S.db.doc('ai/' + k).delete()); } catch (e) { dbFail(e); break; } } }
  }
  S.meta.example = false;
  S.busy.import = false; derive();
  toast(`Imported ${fmt(incoming.length)} leads${saved ? '' : ' (not saved)'}`);
  go('verify');
}

  }
  const rejected = [['Lead Name', 'Company', 'Title', 'Email', 'Lead Score', 'Reason']];
  for (const r of D.rows) { if (r.exportable) continue; const why = rejectReason(r) || 'No personalized email (excluded by export setting)'; rejected.push([leadName(r.L), r.L.company, r.L.title, r.L.email, r.sc.total, why]); }
  const c = D.c; const icp = S.icp || {};

    ['Data', S.meta.example ? 'EXAMPLE ROWS: fictional companies and people' : (S.meta.lastImport?.file || S.meta.source || 'Imported leads')],
    ['Seller', S.company?.company || ''], ['Website', S.company?.website || ''], ['Product', S.company?.product || ''],
    ['Target segments', (icp.segments || []).map(s => s.name).join(', ')], ['Countries', arr(icp.countries).join(', ')],
    ['Score weights', Object.entries(normWeights(S.out.weights)).map(([k, w]) => WEIGHT_LABELS[k] + ' ' + Math.round(w)).join(' · ')],
    ['Qualification threshold', S.out.threshold], ['Email variant in Lead Master', 'Variant ' + S.out.variant],
    ['', ''], ['Leads imported', c.total], ['Usable emails', c.usable], ['Qualified (score ≥ ' + S.out.threshold + ')', c.qualified],
    ['Researched', c.researched], ['Personalized', c.personalized], ['Failed QC', c.qcFail], ['Rows in Lead Master', rows.length], ['Rows in Rejected', rejected.length - 1],
  ];
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, sheet(outreach, [24, 28, 32, 30, 70, 70, 70]), 'Outreach');
  XLSX.utils.book_append_sheet(wb, sheet(rejected, [24, 28, 30, 32, 8, 60]), 'Rejected');

}
async function exportExcel() {
  if (!window.XLSX) { toast('The spreadsheet writer did not load. Reload the page.'); return; }
  if (!S.leads.length) { toast('Import leads first (step 3).'); go('discover'); return; }
  if (!S.downloads) { toast('Downloads are not available in this view. Open the page in claude.ai.'); return; }
  const { wb, count } = buildWorkbook();
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
  const filename = `ProHost-leads-${S.meta.example ? 'EXAMPLE-' : ''}${today()}.xlsx`;
  try { const res = await S.downloads.save({ filename, data: new Blob([buf]) }); if (res?.status === 'saved') toast(`Saved ${filename} with ${fmt(count)} leads`); }
  catch (e) {
    const c = e?.code;
    if (c === 'declined') return;
    if (c === 'rate_limited') toast('A download prompt is already open.');

}

/* all leads */
function filteredLeads() {
  const q = lc(S.table.q); const f = S.table.filter;
  return D.rows.filter(r => {
    if (f === 'qualified' && !r.qualified) return false;
    if (f === 'personalized' && !(r.qualified && r.personalized)) return false;
    if (f === 'rejected' && r.usable) return false;
    if (f === 'below' && !(r.usable && !r.qualified)) return false;
    if (q && !lc([leadName(r.L), r.L.company, r.L.email, r.L.title, r.L.country].join(' ')).includes(q)) return false;
    return true;
  }).sort((a, b) => b.sc.total - a.sc.total);
}
function tableHtml() {
  const list = filteredLeads(); const per = 50; const pages = Math.max(1, Math.ceil(list.length / per));

}

      <dt>Source</dt><dd>${esc(L.source || '—')}</dd></dl></div>
    <div class="card"><div class="card-head"><h2>Score ${r.sc.total} / 100</h2><span class="small muted">${esc(r.sc.roleTier)}${r.sc.countryOk ? '' : ' · outside target countries'}</span></div>
      <div class="parts">${Object.keys(W).map(k => `<div class="part"><span>${WEIGHT_LABELS[k]}</span><div class="track" aria-hidden="true"><span style="width:${W[k] ? (r.sc.parts[k] / W[k] * 100).toFixed(0) : 0}%"></span></div><span class="v num">${Math.round(r.sc.parts[k])}/${Math.round(W[k])}</span></div>`).join('')}</div>
      ${r.sc.activity ? `<p class="small muted">Activity: ${esc(r.sc.activity)}</p>` : ''}${!r.qualified ? `<p class="small"><span class="pill mute">Not exported</span> ${esc(rejectReason(r))}</p>` : (r.qc && !r.qc.ok ? `<div class="err">QC: ${esc(r.qc.issues.join('; '))}</div>` : '')}</div>
    <div class="card"><h2>Research</h2>${rs ? `<dl class="kv small"><dt>Signal</dt><dd>${rs.signal_source === 'data' ? esc(rs.signal) : '<span class="muted">No signal in the record</span>'}</dd><dt>Pain point</dt><dd>${esc(rs.pain_point)}</dd><dt>Reason selected</dt><dd>${esc(rs.reason_selected)}</dd><dt>Summary</dt><dd>${esc(rs.summary)}</dd></dl>` : '<p class="muted small">Not researched yet.</p>'}</div>
    <div class="card"><div class="card-head"><h2>Emails</h2><button class="btn ${ai.emails ? '' : 'primary'} sm" data-act="rewrite" data-key="${esc(L.key)}" ${busy || !aiReady() || !S.company ? 'disabled' : ''}>${busy ? 'Writing…' : ai.emails ? 'Rewrite emails' : 'Write emails'}</button></div>
      ${msgHtml('one')}${ai.emails ? mailsFor(r) : '<p class="muted small">No emails yet.</p>'}</div>
  </aside>`;
}

/* ───────────── events ───────────── */
const ACT = {
  go: el => go(el.dataset.view),
  export: () => exportExcel(),
  analyze: () => analyzeCompany(),
  buildIcp: () => buildIcp(),
  cancel: el => { S.busy[el.dataset.k]?.abort?.(); },
  run: el => runAgents(el.dataset.kind),
  stop: () => stopJob(),
  copy: el => copy(el.dataset.text || '', el),
  toggleEdit: el => { S.edit[el.dataset.k] = !S.edit[el.dataset.k]; S.msg['edit' + (el.dataset.k === 'icp' ? 'Icp' : 'Company')] = ''; render(); },
  saveEdit: async el => {
    const k = el.dataset.k; const id = k === 'icp' ? 'editIcp' : 'editCompany';
    try {
      const v = JSON.parse($('#' + id).value);
      if (k === 'company') { S.company = normalizeProfile(v, S.company?.website || ''); await saveDoc('config/company', { profile: S.company, sourceUrl: S.coSource.url, sourceText: S.coSource.text.slice(0, 60000), updatedAt: Date.now() }); }
      else { S.icp = normalizeIcp(v, arr(v.goals || S.icp?.goals), arr(v.countries || S.icp?.countries)); await saveDoc('config/icp', { icp: S.icp, updatedAt: Date.now() }); }
      S.edit[k] = false; derive(); render(); toast('Saved');
    } catch (e) { S.msg[id] = 'That is not valid JSON: ' + (e?.message || ''); render(); }
  },
  chipAdd: el => {
    const kind = el.dataset.kind; const inp = $('#add-' + kind); const v = norm(inp?.value); if (!v) return;
    S.icp = S.icp || { goals: [], countries: [], segments: [] };
    const list = arr(S.icp[kind]); if (!list.some(x => lc(x) === lc(v))) list.push(kind === 'countries' ? (canonCountry(v) || titleCase(v)) : v);
    S.icp[kind] = list; saveDoc('config/icp', { icp: S.icp, updatedAt: Date.now() }); derive(); render();
  },
  chipDel: el => {
    const kind = el.dataset.kind; const list = arr(S.icp?.[kind]); list.splice(+el.dataset.i, 1);
    S.icp[kind] = list; saveDoc('config/icp', { icp: S.icp, updatedAt: Date.now() }); derive(); render();
  },
  doImport: () => doImport(),
  cancelImport: () => { S.import = null; render(); },
  verifyCsv: () => exportVerifyCsv(),
  lead: el => { S.drawer = el.dataset.key; S.msg.one = ''; renderDrawer(); },
  closeDrawer: () => { S.drawer = null; renderDrawer(); },
  rewrite: el => rewriteOne(el.dataset.key),
  page: el => { S.table.page = Math.max(0, S.table.page + (+el.dataset.d)); $('#tableBox').innerHTML = tableHtml(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.drawer) { S.drawer = null; renderDrawer(); return; }
  if (e.key === 'Enter' && e.target.matches?.('tr[data-act="lead"]')) { S.drawer = e.target.dataset.key; renderDrawer(); return; }
  if (e.key === 'Enter' && e.target.id?.startsWith('add-')) { e.preventDefault(); ACT.chipAdd({ dataset: { kind: e.target.id.slice(4) } }); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'leadFile') { onLeadFile(t.files?.[0]); t.value = ''; return; }
  if (t.id === 'verifyFile') { onVerifyFile(t.files?.[0]); t.value = ''; return; }
  if (t.dataset.map && S.import) { S.import.map[t.dataset.map] = t.value; render(); return; }
  if (t.dataset.impmode && S.import) { S.import.mode = t.dataset.impmode; return; }
  if (t.id === 'tableF') { S.table.filter = t.value; S.table.page = 0; $('#tableBox').innerHTML = tableHtml(); return; }
  if (t.dataset.weight) { S.out.weights[t.dataset.weight] = clampInt(t.value, 0, 100); saveOutSoon(); derive(); render(); return; }
  if (t.dataset.out) {
    const k = t.dataset.out;
    if (t.type === 'checkbox') S.out[k] = t.checked;
    else if (k === 'topN') S.out[k] = clampInt(t.value, 1, 500);
    else if (k === 'threshold') S.out[k] = clampInt(t.value, 0, 100);
    else S.out[k] = k === 'cta' ? (norm(t.value) || DEFAULT_OUT.cta) : norm(t.value);
    saveOutSoon(); derive(); render();
  }
});
let qTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'tableQ') { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { S.table.q = v; S.table.page = 0; $('#tableBox').innerHTML = tableHtml(); }, 180); }
});
['dragover', 'dragleave', 'drop'].forEach(type => document.addEventListener(type, e => {
  const drop = e.target.closest?.('#drop'); if (!drop) return;
  e.preventDefault();
  if (type === 'dragover') drop.classList.add('over');
  else drop.classList.remove('over');
  if (type === 'drop') onLeadFile(e.dataTransfer?.files?.[0]);
}));

/* ───────────── boot ───────────── */
async function boot() {
  const v = lsGet('pl-view'); if (v && VIEWS.has(v)) S.view = v;
  derive(); render();
  const c = window.claude;
  if (!c?.use) { S.loaded = true; setSave('off'); render(); return; }
  const [db, sample, downloads, user] = await Promise.all(['db', 'sample', 'downloads', 'user'].map(n => c.use(n).catch(() => null)));
  S.sample = sample; S.downloads = downloads;
  if (user) { try { if (await user.can('data.write') === false) S.readOnly = true; } catch { /* not told */ } }
  if (db) { S.db = db; await loadAll(); } else setSave('off');
  if (!S.company && S.view === 'overview') S.view = 'company';
  S.loaded = true; derive(); render();
}
boot();
})();
</script>
