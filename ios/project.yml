# XcodeGen spec. The .xcodeproj is generated in CI (`xcodegen generate`) and never committed.
name: ProHost
options:
  bundleIdPrefix: app.geonajjar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 884APQLMP4
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # NO: the pre-build script runs Gradle to build and copy the shared Kotlin framework and its Compose resources.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "9.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    # 9.0.0 is the first release with signIn(withPresenting:hint:additionalScopes:nonce:completion:) (8.x has no nonce).
    from: "9.0.0"
targets:
  ProHost:
    type: application
    platform: iOS
    sources:
      - path: ProHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.geonajjar.prohost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # :shared (Kotlin Multiplatform + Compose Multiplatform) as the static framework ProHostShared.
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ProHostShared"]
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ProHost AppStore CI
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - package: GoogleMaps
        product: GoogleMaps
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Build the shared Kotlin framework (ProHostShared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Gradle comes from the CI setup (gradle/actions/setup-gradle) or a local install; the repo has no wrapper script.
          GRADLE="$(command -v gradle || echo /opt/homebrew/bin/gradle)"
          # 6 GB: the release Kotlin/Native link of the whole app does not fit in the 4 GB of gradle.properties.
          "$GRADLE" --no-daemon -Dorg.gradle.jvmargs=-Xmx6g :shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      - name: Upload dSYMs to Crashlytics
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            RUN="${BUILD_DIR%Build/*}SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
            if [ -x "$RUN" ]; then "$RUN" || echo "warning: Crashlytics dSYM upload failed"; else echo "warning: Crashlytics run script not found at $RUN"; fi
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
    entitlements:
      path: ProHost/ProHost.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: production
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: ProHost/Info.plist
      properties:
        CFBundleDisplayName: ProHost
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        # Required by Compose Multiplatform (ProMotion frame pacing); it refuses to start without it.
        CADisableMinimumFrameDurationOnPhone: true
        UIAppFonts: [manrope_semibold.ttf, manrope_bold.ttf, manrope_extrabold.ttf, roboto_regular.ttf, roboto_medium.ttf, roboto_bold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FIREBASE_AUTOMATIC_SCREEN_REPORTING_ENABLED: false
        CFBundleURLTypes:
          - CFBundleURLName: app.geonajjar.prohost
            CFBundleURLSchemes: [prohost]
          # Google Sign-In redirect: REVERSED_CLIENT_ID of GoogleService-Info.plist.
          - CFBundleURLName: google-signin
            CFBundleURLSchemes: [com.googleusercontent.apps.646730915838-7gkhelto1gkuh5equtr8tj9lh6u4p4us]
  ProHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProHostTests
    dependencies:
      - target: ProHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.geonajjar.prohost.tests
  ProHostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ProHostUITests
    dependencies:
      - target: ProHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.geonajjar.prohost.uitests
        TEST_TARGET_NAME: ProHost
schemes:
  ProHost:
    build:
      targets:
        ProHost: all
        ProHostTests: [test]
        ProHostUITests: [test]
    test:
      targets:
        - ProHostTests
        - ProHostUITests
