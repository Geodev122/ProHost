# XcodeGen spec. The .xcodeproj is generated in CI (`xcodegen generate`) and never committed.
name: ProHost
options:
  bundleIdPrefix: app.geonajjar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 884APQLMP4
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
targets:
  ProHost:
    type: application
    platform: iOS
    sources:
      - path: ProHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.geonajjar.prohost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAppCheck
    entitlements:
      path: ProHost/ProHost.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: production
    info:
      path: ProHost/Info.plist
      properties:
        CFBundleDisplayName: ProHost
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UIAppFonts: [manrope_semibold.ttf, manrope_bold.ttf, manrope_extrabold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FIREBASE_AUTOMATIC_SCREEN_REPORTING_ENABLED: false
        CFBundleURLTypes:
          - CFBundleURLName: app.geonajjar.prohost
            CFBundleURLSchemes: [prohost]
  ProHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProHostTests
    dependencies:
      - target: ProHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.geonajjar.prohost.tests
schemes:
  ProHost:
    build:
      targets:
        ProHost: all
        ProHostTests: [test]
    test:
      targets:
        - ProHostTests
