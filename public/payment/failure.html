<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Not Completed - ProHost</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    :root {
      --primary: #F25F4C;
      --primary-hover: #E04E3A;
      --oxford-blue: #0F172A;
      --vibrant-blue: #2563EB;
      --error: #DC2626;
      --error-bg: #FEF2F2;
      --error-border: #FECACA;
      --bg-light: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 2rem;
      color: var(--error);
    }
    h1 { font-size: 1.5rem; color: var(--oxford-blue); font-weight: 800; margin-bottom: 0.6rem; }
    p { color: var(--text-muted); font-size: 0.98rem; line-height: 1.6; margin-bottom: 1.75rem; }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: var(--primary);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.9rem 1.5rem;
      border-radius: 0.65rem;
      transition: background-color 0.15s;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .fallback {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .brand-title { font-size: 1.05rem; font-weight: 800; margin-top: 2rem; }
    .brand-pro { color: var(--oxford-blue); }
    .brand-host { color: var(--vibrant-blue); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">&#10007;</div>
    <h1>Payment Not Completed</h1>
    <p>
      Your Whish payment didn't go through. Nothing was charged and your account
      wasn't changed — go back to the app to try again.
    </p>
    <a class="btn" href="prohost://payment/failure" id="open-app-btn">Open ProHost App</a>
    <p class="fallback">
      If nothing happens when you tap the button, switch back to the ProHost app
      yourself and retry the upgrade from there.
    </p>
    <div class="brand-title"><span class="brand-pro">Pro</span><span class="brand-host">Host</span></div>
  </div>
</body>
</html>
